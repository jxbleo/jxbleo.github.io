name: Deploy static site to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cos-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public static artifact
        run: npm run build:static

      - name: Verify public artifact boundary
        run: |
          test -f dist/index.html
          test ! -e dist/cloudfunctions
          test ! -e dist/scripts
          test ! -e dist/docs
          test ! -e dist/AGENTS.md
          test ! -e dist/content/speaking

      - name: Upload public artifact to COS
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: mrcatenglish-web-1441914554
          COS_REGION: ap-shanghai
        run: node scripts/deploy-static-to-cos.js
