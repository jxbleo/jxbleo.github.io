<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Early Population Movement to the Americas</title>
  <desc id="desc">A clean animated teaching map showing early population routes from Asia through the Bering Strait into North, Central, and South America, with IELTS-style labels A to F.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.58" stop-color="#eef4f8"/>
      <stop offset="1" stop-color="#e4edf3"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#dde4e7"/>
      <stop offset="0.55" stop-color="#b9c5cb"/>
      <stop offset="1" stop-color="#99a9b1"/>
    </linearGradient>
    <filter id="softShadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#203247" flood-opacity="0.15"/>
    </filter>
    <filter id="labelShadow" x="-24%" y="-24%" width="148%" height="148%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#111827"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#334155"/>
    </marker>
    <style>
      svg {
        background: #f5f9fc;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
      }
      .frame {
        fill: url(#paper);
        stroke: #1f2937;
        stroke-width: 3.2;
      }
      .title {
        fill: #111827;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 0;
      }
      .land {
        fill: url(#land);
        stroke: #485867;
        stroke-width: 2.2;
        filter: url(#softShadow);
      }
      .island {
        fill: #b6c2c8;
        stroke: #485867;
        stroke-width: 1.6;
      }
      .route {
        fill: none;
        stroke: #111827;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
        animation: routePulse 3.4s ease-in-out infinite;
      }
      .route.light {
        stroke: #334155;
        stroke-width: 5.3;
        opacity: 0.92;
        stroke-dasharray: 14 17;
        marker-end: url(#dashArrow);
        animation: dashFlow 1.1s linear infinite;
      }
      .delay-1 { animation-delay: .25s; }
      .delay-2 { animation-delay: .55s; }
      .delay-3 { animation-delay: .85s; }
      .delay-4 { animation-delay: 1.15s; }
      .delay-5 { animation-delay: 1.45s; }
      .label {
        fill: #111827;
        font-size: 34px;
        font-weight: 850;
        font-style: italic;
        letter-spacing: 0;
        filter: url(#labelShadow);
      }
      .label.small {
        font-size: 30px;
        font-style: normal;
        font-weight: 900;
      }
      .node {
        fill: #fff;
        stroke: #111827;
        stroke-width: 3;
        filter: url(#labelShadow);
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseNode 2.8s ease-in-out infinite;
      }
      .node-text {
        fill: #111827;
        font-size: 28px;
        font-weight: 950;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .n1 { animation-delay: .1s; }
      .n2 { animation-delay: .35s; }
      .n3 { animation-delay: .6s; }
      .n4 { animation-delay: .85s; }
      .n5 { animation-delay: 1.1s; }
      .n6 { animation-delay: 1.35s; }
      .strait {
        fill: none;
        stroke: #111827;
        stroke-width: 3.2;
        stroke-linecap: round;
      }
      .caption {
        fill: rgba(255,255,255,0.86);
        stroke: rgba(71,85,105,0.28);
        stroke-width: 1.5;
      }
      .caption-text {
        fill: #475569;
        font-size: 22px;
        font-weight: 780;
        letter-spacing: 0;
      }
      @keyframes drawRoute {
        from { stroke-dashoffset: 1900; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes routePulse {
        0%, 100% { stroke-width: 8; opacity: 0.94; }
        50% { stroke-width: 9.4; opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -31; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .route, .route.light, .node {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect class="frame" x="30" y="34" width="1540" height="970" rx="18"/>
  <text class="title" x="70" y="105">Early Population Movement to the Americas</text>

  <!-- Redrawn from the clearer photo as an original teaching diagram. -->
  <path class="land" d="M76 511 C88 456 137 420 205 411 C282 401 351 431 369 484 C386 534 342 585 259 595 C167 606 60 585 76 511 Z"/>
  <path class="land" d="M354 413 C459 350 620 336 735 385 C803 415 852 466 886 533 C941 640 923 735 844 786 C747 850 623 788 572 696 C535 630 492 596 416 579 C333 560 287 506 305 459 C313 438 330 424 354 413 Z"/>
  <path class="land" d="M695 285 C808 206 975 210 1101 286 C1186 337 1234 410 1225 484 C1215 569 1129 614 1042 591 C975 573 946 522 878 505 C770 478 672 439 637 372 C621 341 642 313 695 285 Z"/>
  <path class="land" d="M1147 151 C1223 111 1342 112 1412 167 C1480 221 1490 305 1437 372 C1387 435 1285 430 1228 374 C1182 328 1144 287 1094 269 C1053 254 1087 183 1147 151 Z"/>
  <path class="land" d="M867 713 C914 672 987 680 1044 742 C1102 805 1120 904 1084 964 C1051 1019 974 1008 938 946 C909 895 903 835 869 801 C835 767 826 748 867 713 Z"/>
  <path class="land" d="M1054 584 C1098 568 1159 577 1196 608 C1230 636 1217 673 1168 685 C1122 696 1083 678 1037 673 C1007 670 1015 599 1054 584 Z"/>

  <path class="island" d="M578 285 C611 260 653 266 672 294 C689 320 663 349 627 346 C591 343 551 305 578 285 Z"/>
  <path class="island" d="M704 228 C738 202 789 211 808 243 C824 272 796 302 754 299 C715 296 674 250 704 228 Z"/>
  <path class="island" d="M892 206 C929 177 988 186 1011 220 C1033 252 1004 292 955 287 C912 282 858 232 892 206 Z"/>

  <text class="label" x="100" y="540">Asia</text>
  <text class="label" x="354" y="492">Alaska</text>
  <text class="label" x="598" y="675">Canada</text>
  <text class="label" x="752" y="790">U.S.A</text>
  <text class="label" x="1194" y="354">Greenland</text>
  <text class="label" x="1138" y="750">Central America</text>
  <text class="label" x="958" y="856">South</text>
  <text class="label" x="958" y="896">America</text>
  <text class="label small" x="255" y="444">Bering</text>
  <text class="label small" x="254" y="480">Strait</text>
  <path class="strait" d="M310 465 L310 545"/>

  <!-- Solid routes follow the main arrows visible in the photo. -->
  <path class="route" d="M111 480 C235 322 440 265 633 253 C824 240 983 270 1105 351"/>
  <path class="route delay-1" d="M111 584 C134 701 248 785 415 786 C532 788 632 763 754 806"/>
  <path class="route delay-2" d="M317 548 C481 549 634 550 751 555 C842 560 906 582 950 630"/>
  <path class="route delay-3" d="M452 552 C590 571 705 623 786 715"/>
  <path class="route delay-4" d="M610 574 C761 632 891 714 1018 735"/>
  <path class="route delay-5" d="M862 765 C899 820 916 881 934 963"/>

  <!-- Dashed or finer routes are shown as moving tracks. -->
  <path class="route light delay-2" d="M95 537 C272 538 469 537 641 534 C810 530 976 519 1138 500"/>
  <path class="route light delay-3" d="M324 596 C446 668 541 772 582 892"/>
  <path class="route light delay-4" d="M1042 785 C986 832 1013 902 1051 966"/>

  <!-- IELTS answer-location labels, positioned from the photo reference. -->
  <circle class="node n1" cx="92" cy="510" r="26"/><text class="node-text" x="92" y="510">A</text>
  <circle class="node n2" cx="158" cy="488" r="26"/><text class="node-text" x="158" y="488">B</text>
  <circle class="node n3" cx="153" cy="550" r="26"/><text class="node-text" x="153" y="550">C</text>
  <circle class="node n4" cx="839" cy="639" r="26"/><text class="node-text" x="839" y="639">D</text>
  <circle class="node n5" cx="112" cy="610" r="26"/><text class="node-text" x="112" y="610">E</text>
  <circle class="node n6" cx="151" cy="622" r="26"/><text class="node-text" x="151" y="622">F</text>

  <g transform="translate(1042 124)">
    <rect class="caption" x="0" y="0" width="408" height="64" rx="22"/>
    <text class="caption-text" x="28" y="41">Animated route map for IELTS Reading</text>
  </g>
</svg>
