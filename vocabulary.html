<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/touch-behavior.css?v=20260723-1">
    <title>Vocabulary Unit</title>
    <style>
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --border: #dbe2ea;
            --soft: #f4f7fb;
            --card: #ffffff;
            --accent: #0f766e;
            --accent-soft: #dbf5ef;
            --test-red: #dc2626;
            --test-red-soft: #fee2e2;
            --use-gold: #f59e0b;
            --use-gold-deep: #92400e;
            --use-gold-soft: #fef3c7;
            --use-gold-glow: rgba(245, 158, 11, 0.34);
            --warm: #9a3412;
            --warm-soft: #ffedd5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, #fef3c7 0, transparent 28%),
                radial-gradient(circle at top right, #d1fae5 0, transparent 22%),
                linear-gradient(180deg, #f8fafc 0%, #eef5f7 100%);
        }

        .shell {
            max-width: 1100px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, #134e4a 0%, #0f766e 52%, #14b8a6 100%);
            color: #fff;
            border-radius: 24px;
            padding: 24px 28px;
            box-shadow: 0 18px 40px rgba(15, 118, 110, 0.18);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 16px;
        }

        .hero-actions[hidden] {
            display: none;
        }

        .stat {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 18px;
            padding: 16px 18px;
        }

        .stat-label {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.72);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            margin-top: 22px;
            padding: 24px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
        }

        .panel h2 {
            margin: 0 0 14px;
            font-size: 1.15rem;
        }

        .switcher {
            display: inline-flex;
            gap: 8px;
            padding: 6px;
            border-radius: 999px;
            background: #e9f1f4;
            margin-bottom: 18px;
        }

        .switch-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .switch-btn.active {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        body.test-locked .switch-btn:not([data-view-target="test-view"]) {
            opacity: .46;
            cursor: not-allowed;
        }

        .view { display: none; }
        .view.active { display: block; }

        .learn-sticky {
            position: sticky;
            top: 0;
            z-index: 220;
            margin: -2px 0 18px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 22px;
            background: linear-gradient(180deg, #ffffff, #f7fdfb);
            box-shadow: 0 18px 42px rgba(19, 70, 63, 0.13);
            backdrop-filter: blur(18px) saturate(1.1);
            isolation: isolate;
        }

        .learn-sticky.has-word-bank::after,
        .test-sticky.has-word-bank::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: -10px;
            height: 10px;
            border-radius: 0 0 18px 18px;
            background: linear-gradient(180deg, rgba(15, 118, 110, 0.09), transparent);
            pointer-events: none;
        }

        .sticky-number-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .learn-word-bank,
        .test-word-bank {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transform: translateY(-8px);
            transition:
                max-height 860ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 560ms ease,
                transform 860ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .learn-word-bank.is-open,
        .test-word-bank.is-open {
            max-height: 190px;
            opacity: 1;
            transform: translateY(0);
        }

        .word-set-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            padding: 2px 2px 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .word-set-filter::-webkit-scrollbar {
            display: none;
        }

        .word-set-btn {
            appearance: none;
            -webkit-appearance: none;
            display: inline-grid;
            min-width: 34px;
            width: 34px;
            height: 34px;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid rgba(15, 118, 110, 0.14);
            border-radius: 999px;
            padding: 0;
            color: var(--accent);
            background: #fff;
            font-size: 0.88rem;
            font-weight: 900;
            line-height: 1;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(15, 23, 42, 0.045);
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
        }

        .word-bank-toggle {
            appearance: none;
            -webkit-appearance: none;
            display: inline-grid;
            min-width: 34px;
            width: 34px;
            height: 34px;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid rgba(15, 118, 110, 0.18);
            border-radius: 999px;
            padding: 0;
            color: var(--accent);
            background: #ecfdf5;
            font-size: 0.78rem;
            font-weight: 1000;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(15, 23, 42, 0.045);
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
        }

        .word-bank-toggle.is-collapsed {
            background: #fff;
            color: var(--muted);
        }

        .word-bank-toggle:disabled {
            opacity: 0.38;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .word-bank-toggle-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 34px;
            width: 34px;
            min-height: 34px;
            margin: 0;
        }

        .word-bank-toggle-slot[hidden] {
            display: none;
        }

        .word-bank-toggle-slot .word-bank-toggle,
        .word-bank-toggle-slot .word-bank-redo {
            position: static;
            transform: none;
        }

        .word-bank-toggle-slot .word-bank-toggle:hover:not(:disabled),
        .word-bank-toggle-slot .word-bank-toggle:focus-visible:not(:disabled),
        .word-bank-toggle-slot .word-bank-redo:hover,
        .word-bank-toggle-slot .word-bank-redo:focus-visible {
            transform: translateY(-1px);
        }

        .word-set-btn.all {
            width: auto;
            padding: 0 12px;
        }

        .word-bank-toggle:hover:not(:disabled),
        .word-bank-toggle:focus-visible:not(:disabled),
        .word-set-btn:hover,
        .word-set-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 9px 18px rgba(15, 118, 110, 0.12);
        }

        .word-set-btn.active {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.20);
        }

        .word-list-empty {
            grid-column: 1 / -1;
            padding: 24px;
            border: 1px dashed rgba(15, 118, 110, 0.22);
            border-radius: 18px;
            color: var(--muted);
            background: rgba(15, 118, 110, 0.04);
            font-weight: 800;
            text-align: center;
        }

        .word-practice-panel {
            margin-top: 18px;
        }

        .word-practice-entry {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 18px 0 2px;
        }

        .worksheet-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            padding-left: 13px;
            padding-right: 15px;
            text-decoration: none;
            border: 1px solid rgba(15, 118, 110, 0.20);
            background: linear-gradient(180deg, #fff, #f7fffb);
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.10);
            cursor: pointer;
            font-family: inherit;
        }

        .worksheet-download:hover,
        .worksheet-download:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(15, 118, 110, 0.16);
        }

        .worksheet-download.wordlist {
            border-color: rgba(255,255,255,0.32);
            background: #fff;
            color: #0f5f57;
        }

        .worksheet-download.practice {
            border-color: rgba(255,255,255,0.32);
            color: #0f5f57;
        }

        .worksheet-download .download-icon-wrap {
            position: relative;
            display: inline-grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .worksheet-download .download-main-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .worksheet-download .download-mini-icon {
            position: absolute;
            right: -5px;
            bottom: -3px;
            display: inline-grid;
            place-items: center;
            width: 11px;
            height: 11px;
            border-radius: 999px;
            color: #fff;
            background: #0f766e;
            box-shadow: 0 0 0 2px #fff;
        }

        .worksheet-download .download-mini-icon svg {
            width: 9px;
            height: 9px;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .worksheet-download-card {
            width: min(620px, 100%);
            max-height: calc(100vh - 104px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 24px;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(0,0,0,.24);
            animation: resultPop 320ms ease-out both;
        }

        .worksheet-download-overlay {
            place-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .worksheet-download-shell {
            display: grid;
            justify-items: center;
            width: min(620px, 100%);
            gap: 12px;
        }

        .worksheet-download-header {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 36px;
            padding: 0 46px;
        }

        .worksheet-download-back {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid rgba(15, 118, 110, 0.18);
            border-radius: 999px;
            color: #0f5f57;
            background: #fff;
            cursor: pointer;
        }

        .worksheet-download-back:hover,
        .worksheet-download-back:focus-visible {
            border-color: rgba(15, 118, 110, 0.42);
            background: rgba(15, 118, 110, 0.07);
        }

        .worksheet-download-back[hidden],
        .worksheet-download-mode-actions[hidden] {
            display: none;
        }

        .worksheet-download-back svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .worksheet-download-card h2 {
            margin: 0;
            font-size: 1.25rem;
            text-align: center;
        }

        .worksheet-download-card p {
            margin: 6px 0 0;
            color: var(--muted);
            line-height: 1.48;
        }

        .worksheet-download-mode-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }

        .worksheet-download-mode-actions .btn {
            min-height: 52px;
            border: 1px solid rgba(15, 118, 110, 0.16);
        }

        .worksheet-custom-panel {
            margin-top: 18px;
        }

        .worksheet-custom-panel[hidden] {
            display: none;
        }

        .worksheet-custom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }

        .worksheet-set-row {
            align-items: center;
        }

        .worksheet-custom-label {
            flex: 0 0 auto;
            font-size: 0.82rem;
            font-weight: 900;
            color: #0f5f57;
            text-transform: uppercase;
        }

        .worksheet-group-grid {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
            gap: 8px;
            margin-top: 0;
            padding: 2px 2px 8px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .worksheet-group-grid::-webkit-scrollbar {
            display: none;
        }

        .worksheet-group-chip {
            flex: 0 0 auto;
            border: 1px solid rgba(15, 118, 110, 0.20);
            border-radius: 999px;
            padding: 8px 11px;
            color: #0f5f57;
            background: #fff;
            font-size: 0.84rem;
            font-weight: 850;
            cursor: pointer;
        }

        .worksheet-group-chip.active {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.18);
        }

        .worksheet-toggle {
            position: relative;
            width: 48px;
            height: 28px;
            border: 1px solid rgba(15, 118, 110, 0.22);
            border-radius: 999px;
            background: #e8eef2;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .worksheet-toggle::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(15,23,42,.20);
            transition: transform 160ms ease;
        }

        .worksheet-toggle.active {
            border-color: var(--accent);
            background: var(--accent);
        }

        .worksheet-toggle.active::after {
            transform: translateX(20px);
        }

        .worksheet-custom-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 18px;
        }

        .worksheet-download-close {
            min-height: 40px;
            padding: 0 20px;
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 999px;
            color: #fff;
            background: rgba(15, 56, 52, 0.82);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 900;
            cursor: pointer;
            backdrop-filter: blur(14px);
            box-shadow: 0 14px 32px rgba(15,23,42,0.18);
        }

        .worksheet-download-close:hover,
        .worksheet-download-close:focus-visible {
            background: rgba(15, 56, 52, 0.96);
        }

        .worksheet-download-error {
            display: none;
            margin-top: 12px;
            color: #b91c1c;
            font-size: 0.88rem;
            font-weight: 800;
        }

        .worksheet-download-error.show {
            display: block;
        }

        .practice-score {
            display: none;
            align-items: center;
            min-height: 42px;
            padding: 9px 13px;
            border: 1px solid rgba(15, 118, 110, 0.20);
            border-radius: 999px;
            background: rgba(15, 118, 110, 0.08);
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 900;
            line-height: 1;
        }

        .practice-score.show {
            display: inline-flex;
        }

        .practice-redo-btn[hidden] {
            display: none;
        }

        .word-table-wrap {
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #fff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
        }

        th, td {
            padding: 13px 14px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        th {
            position: sticky;
            top: 0;
            background: #f8fbfc;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
        }

        th + th,
        td + td {
            border-left: 1px solid #eef2f7;
        }

        tbody tr:nth-child(even) {
            background: #fbfdff;
        }

        tbody tr:hover {
            background: #f0fdfa;
        }

        tr:last-child td { border-bottom: none; }

        .word-table th:nth-child(1),
        .word-table td:nth-child(1) {
            width: 72px;
            color: var(--muted);
            font-weight: 700;
        }

        .word-table th:nth-child(2),
        .word-table td:nth-child(2) {
            width: 130px;
        }

        .word-table th:nth-child(3),
        .word-table td:nth-child(3) {
            width: 74px;
            text-align: center;
        }

        .word-table th:nth-child(4),
        .word-table td:nth-child(4) {
            width: 48%;
        }

        .word-table th:nth-child(5),
        .word-table td:nth-child(5) {
            width: 28%;
            color: #475569;
        }

        .word-cell {
            color: #0f766e;
            font-size: 1.02rem;
            letter-spacing: 0.01em;
        }

        .emoji {
            font-size: 1.25rem;
            white-space: nowrap;
        }

        .word-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 14px;
        }

        .word-card {
            position: relative;
            min-height: 176px;
            padding: 18px;
            border: 1px solid rgba(15, 118, 110, 0.12);
            border-radius: 18px;
            background:
                linear-gradient(180deg, #ffffff 0%, #fbfefd 100%);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.045);
        }

        .word-card-top {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
            margin-bottom: 12px;
        }

        .word-card-word {
            margin: 0;
            color: var(--accent);
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.05;
        }

        .word-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .vocabulary-speak {
            display: inline-grid;
            place-items: center;
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: #13766d;
            background: #eaf6f2;
            cursor: pointer;
        }

        .vocabulary-speak svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .vocabulary-speak:hover {
            background: #d9eee7;
        }

        .vocabulary-speak:active {
            transform: scale(0.92);
        }

        .vocabulary-speak:focus-visible {
            outline: 3px solid rgba(19, 118, 109, 0.25);
            outline-offset: 2px;
        }

        .word-card-emoji {
            font-size: 1.55rem;
            line-height: 1;
            white-space: nowrap;
        }

        .word-card-definition {
            margin: 0 0 12px;
            color: var(--ink);
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .word-card-meaning {
            margin: 0;
            padding-top: 12px;
            border-top: 1px solid #edf2f7;
            color: #475569;
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .group-grid {
            display: grid;
            gap: 18px;
        }

        .group-card {
            --practice-font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: visible;
            background: #fff;
        }

        .group-head {
            position: sticky;
            top: 60px;
            z-index: 50;
            display: block;
            padding: 18px 20px;
            background: #f8fbfc;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .group-head-main {
            width: 100%;
        }

        .group-title {
            margin: 0;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 850;
        }

        .set-meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 800;
        }

        .set-badge {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(15, 118, 110, 0.08);
            color: var(--accent);
            font-weight: 900;
        }

        .set-badge.test-set {
            background: var(--warm-soft);
            color: var(--warm);
        }

        .group-range {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .group-wordline {
            margin: 10px 0 0;
            color: var(--ink);
            font-size: 0.93rem;
            line-height: 1.65;
        }

        .word-bank {
            margin-top: 12px;
            padding: 0;
            font-size: var(--practice-font-size);

            background: #f8fbfc;

        .test-confirm-overlay {

        .test-confirm-card {

            padding: 24px;

        .test-confirm-card h2 { margin: 0 0 8px; }

        .test-confirm-overlay.quiz-gold {

        .test-confirm-overlay.quiz-gold .test-confirm-card {
            --quiz-gold-edge-angle: 0deg;

            background:

                conic-gradient(
                    from var(--quiz-gold-edge-angle),
                    rgba(245, 158, 11, 0.38) 0 72%,
                    rgba(255, 255, 255, 0.82) 78%,
                    #fff1a6 84%,

                    rgba(245, 158, 11, 0.38) 96% 100%
                ) border-box;

            animation: resultPop 320ms ease-out both, quizGoldEdgeOrbit 7s linear infinite;
        }

        .test-confirm-overlay.quiz-gold .test-confirm-card h2 {
            color: var(--use-gold-deep);
        }

        .test-confirm-overlay.quiz-gold [data-test-dialog="cancel"] {
            border: 1px solid rgba(245, 158, 11, 0.28);
            background: rgba(255,255,255,0.72);

        .test-confirm-overlay.quiz-gold [data-test-dialog="confirm"] {
            border: 1px solid rgba(245, 158, 11, 0.42);

        body.test-locked .history-toolbar { display: none; }

        .history-toolbar {
            position: fixed;
            z-index: 999;
            right: 14px;

        }
        .history-disputed { box-shadow: 0 0 0 3px rgba(91,33,182,.16) !important; }
        .history-dispute-approved { box-shadow: 0 0 0 3px rgba(35,122,82,.20) !important; }
        .history-dispute-rejected { box-shadow: 0 0 0 3px rgba(181,71,71,.16) !important; }
        .history-dispute-note { margin-top: 8px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: #f8fbfa; font-size: .84rem; }
        .history-dispute-note.correct { border-color: #8cc8a8; background: #ecf9f1; }
        .history-dispute-note.wrong { border-color: #efc9c3; background: #fff0ed; }
        .history-dispute-note.pending { border-color: #eed08e; background: #fff8e5; }
        .history-dispute-note.approved { border-color: #8cc8a8; background: #ecf9f1; }
        .history-dispute-note.rejected { border-color: #efc9c3; background: #fff0ed; }
        .history-dispute-note strong,
        .history-dispute-note span,
        .history-dispute-note small { display: block; }
        .history-dispute-note span { margin-top: 3px; font-weight: 850; }
        .history-dispute-note small { margin-top: 4px; color: var(--muted); }

        @property --quiz-gold-edge-angle {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes quizGoldEdgeOrbit {
            to { --quiz-gold-edge-angle: 360deg; }
        }

        @keyframes resultPop {
            from { opacity: 0; transform: translateY(18px) scale(.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloze-mode-row.test-row,
            .test-confirm-overlay.quiz-gold .test-confirm-card {
                animation: none;
            }
        }

        .dictation-empty {
            padding: 22px;
            border: 1px dashed var(--border);

        .identity-status {
            position: fixed;
            top: 16px;
            right: 18px;
            z-index: 60;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.88);
            border: 1px solid rgba(255,255,255,0.92);

            font-size: 0.86rem;

        .error {

        @media (max-width: 700px) {
            body {
                padding: 18px 10px 40px;

            .cloze-mode-row {

            }

            .worksheet-download-card {

            .worksheet-custom-actions {
                justify-content: flex-start;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="identity-status" id="identity-status">Login</div>
    <div class="shell">
        <div id="loading" class="loading">Loading vocabulary unit...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="app" style="display:none;">
            <section class="hero">

                            <div id="word-set-filter" class="word-set-filter" aria-label="Study Set filter"></div>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>

    <script src="assets/js/cloudbase-client.js?v=20260707-4"></script>
    <script src="assets/js/practice-session.js?v=20260808-1"></script>

    <script src="assets/js/vocabulary-worksheet-pdf.js?v=20260712-1"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var setId = params.get('set') || 'NGSL-A';
        var assignmentId = params.get('assignment') || '';
        var VOCABULARY_TEST_SECONDS_PER_GROUP = 90;
        var prefillAttemptId = params.get('prefill') || '';
        var historyAttemptId = params.get('history') || prefillAttemptId;
        var historyBestPercentage = params.get('history_score') == null ? null : Number(params.get('history_score'));
        if (isNaN(historyBestPercentage)) historyBestPercentage = null;
        var focusQuestionId = params.get('focus') || '';
        var assignmentEntryMode = params.get('entry') || '';
        var assignmentStatus = params.get('status') || '';
        var answerRevealAvailable = false;
        var answerRevealConfirmed = false;
        var testRedoAvailable = false;
        var teacherMode = params.get('teacher') === '1';
        var teacherAnswerKey = null;
        var teacherAnswersVisible = false;
        var unitData = null;
        var testTimerId = null;
        var testHeartbeatId = null;
        var testHeartbeatRetryId = null;
        var testHeartbeatInFlight = false;
        var testHeartbeatFailureCount = 0;
        var testLastHeartbeatSuccessAt = 0;
        var testHeartbeatGeneration = 0;
        var VOCABULARY_HEARTBEAT_INTERVAL_MS = 10 * 1000;
        var VOCABULARY_HEARTBEAT_REQUEST_TIMEOUT_MS = 8 * 1000;
        var VOCABULARY_HEARTBEAT_RECOVERY_WINDOW_MS = 60 * 1000;
        var VOCABULARY_HEARTBEAT_RETRY_DELAYS_MS = [2 * 1000, 5 * 1000, 10 * 1000];
        var testRemainingSeconds = 0;
        var activeTestSessionId = '';
        var activeTestAssignmentId = '';
        var activeTestGroups = [];
        var activeTestGroupCount = 0;
        var activeTestSetIndex = 0;
        var activeTestMode = 'test';
        var selectedClozePracticeGroupIds = [];
        var activeWordGroupId = '';
        var activePracticeGroupId = '';
        var learnWordBankScrollTicking = false;
        var learnWordBankManualState = null;
        var testSetScrollTicking = false;
        var testWordBankManualState = null;
        var testStartedAt = null;
        var testLocked = false;
        var testSubmitting = false;
        var resultAudioCtx = null;
        var RESULT_SOUND_FAILED_TONES = [
            { freq: 392, start: 0, duration: .42, volume: .1, type: 'triangle', to: 293.66 },
            { freq: 261.63, start: .38, duration: .58, volume: .125, type: 'triangle', to: 174.61 },
            { freq: 130.81, start: .43, duration: .52, volume: .04, type: 'sine', to: 98 }
        ];
        var RESULT_SOUND_PASSED_TONES = [
            { freq: 392, start: 0, duration: .13, volume: .11 },
            { freq: 523.25, start: .11, duration: .14, volume: .13 },
            { freq: 783.99, start: .24, duration: .28, volume: .16 }
        ];
        var testHistoryArmed = false;
        var testReviewMode = false;
        var testIntegrityEnded = false;
        var pendingIntegrityNotice = '';
        var students = [
            { id: 'EI6688', label: '甘昕雨Eilene' },
            { id: 'EV3389', label: '刘榆雯Eva' },
            { id: 'LEO6666', label: 'jxbleo' }
        ];

        function getStudentLabel(id) {
            for (var i = 0; i < students.length; i++) {
                if (students[i].id === id) return students[i].label;
            }
            return id;
        }

        function updateIdentityStatus() {
            var el = document.getElementById('identity-status');
            if (!el) return;
            var urlUser = params.get('user');
            if (urlUser && urlUser !== 'VISITOR') {
                localStorage.setItem('opencode_user', urlUser);
                localStorage.removeItem('opencode_visitor');
            } else if (urlUser === 'VISITOR') {
                localStorage.removeItem('opencode_user');
                localStorage.setItem('opencode_visitor', 'true');
            }
            var user = localStorage.getItem('opencode_user') || '';
            var isVisitor = localStorage.getItem('opencode_visitor') === 'true';
            el.textContent = user ? getStudentLabel(user) : (isVisitor ? 'Visitor' : 'Login');
        }

        function currentUserId() {
            return localStorage.getItem('opencode_user') || (localStorage.getItem('opencode_visitor') === 'true' ? 'VISITOR' : '');
        }

        function contentVersion() {
            return window.MRCAT_CONFIG && window.MRCAT_CONFIG.appVersion || '1';
        }

        function vocabularyContentVersion() {
            return String(unitData && unitData.contentVersion || '');
        }

        function testDraftKey() {
            return 'vocab-test-' + setId + '-v' + vocabularyContentVersion() + '-' +
                (assignmentId || currentUserId() || 'visitor');
        }

        function saveTestDraft() {
            if (activeTestMode !== 'test') return;
            if (!activeTestGroups.length || !testStartedAt) return;
            var answers = {};
            document.querySelectorAll('.test-question').forEach(function(card) {
                var input = card.querySelector('.answer-input');
                answers[card.getAttribute('data-question-key')] = input ? input.value : '';
            });
            try {
                localStorage.setItem(testDraftKey(), JSON.stringify({
                    group_ids: activeTestGroups.map(function(group) { return group.id; }),
                    group_count: activeTestGroupCount,
                    test_session_id: activeTestSessionId || '',
                    assignment_id: activeTestAssignmentId || null,
                    started_at: testStartedAt,
                    total_seconds: testDurationSecondsForGroupCount(activeTestGroupCount),
                    answers: answers
                }));
            } catch (e) {}
        }

        function clearTestDraft() {
            try { localStorage.removeItem(testDraftKey()); } catch (e) {}
        }

        function isCountedGroupCount(count) {
            return Number(count || 0) >= 5;
        }

        function testDurationSecondsForGroupCount(count) {
            return Math.max(60, Number(count || 0) * VOCABULARY_TEST_SECONDS_PER_GROUP);
        }

        function formatTestDurationLabel(seconds) {
            var totalSeconds = Math.max(0, Number(seconds || 0));
            if (totalSeconds < 60) return totalSeconds + ' sec';
            var minutes = Math.round((totalSeconds / 60) * 10) / 10;
            return String(minutes).replace(/\.0$/, '') + ' min';
        }

        function isActiveCountedTest() {
            return testLocked && isCountedGroupCount(activeTestGroupCount) && !!activeTestSessionId;
        }

        function normalizeDateString(value) {
            if (!value) return new Date().toISOString();
            var date = new Date(value);
            return isNaN(date.getTime()) ? String(value) : date.toISOString();
        }

        function questionKeyFor(group, question) {
            return question.questionKey || (group.id + ':' + question.number);
        }

        function questionIdsForGroups(groups) {
            var ids = [];
            (groups || []).forEach(function(group) {
                (group.questions || []).forEach(function(question) {
                    ids.push(questionKeyFor(group, question));
                });
            });
            return ids;
        }

        function sessionError(error, fallback) {
            var message = error && (error.message || error.code || String(error)) || '';
            if (/VOCABULARY_TEST_DEVICE_BLOCKED/i.test(message)) {
                return new Error('This account is already taking a vocabulary test on another device or browser tab. Finish that test before opening student features here.');
            }
            if (/VOCABULARY_TEST_SESSION_EXPIRED|VOCABULARY_TEST_SESSION_CLOSED/i.test(message)) {
                return new Error('This vocabulary test has ended because the page was left or the heartbeat expired. Please start again when you are ready.');
            }
            if (/VOCABULARY_CONTENT_OUTDATED/i.test(message)) {
                return new Error('This exercise has been updated. Reload the page before starting or submitting the test.');
            }
            if (/VOCABULARY_TEST_ASSIGNMENT_CANCELLED/i.test(message)) {
                return new Error('This assignment was cancelled while the Quiz was in progress. No attempt was recorded. Return to the Dashboard to continue.');
            }
            if (/VOCABULARY_TEST_ASSIGNMENT_NOT_FOUND|VOCABULARY_TEST_SESSION_MISMATCH/i.test(message)) {
                return new Error('This Quiz can no longer verify the assignment it started with. No attempt was recorded. Return to the Dashboard and start again.');
            }
            return error instanceof Error ? error : new Error(message || fallback || 'Unable to manage this vocabulary test session.');
        }

        function callVocabularyTestSession(action, payload) {
            if (!window.MrCatCloud || typeof window.MrCatCloud.callFunction !== 'function') {
                return Promise.reject(new Error('LOGIN_REQUIRED'));
            }
            return window.MrCatCloud.callFunction('submitAttempt', Object.assign({
                action: action,
                set_id: setId,
                assignment_id: assignmentId || null,
                content_version: vocabularyContentVersion()
            }, payload || {})).then(function(response) {
                if (!response || !response.success) {
                    var error = new Error(response && response.message || response && response.code || 'VOCABULARY_TEST_SESSION_ERROR');
                    if (response && response.code) error.code = response.code;
                    throw error;
                }
                return response;
            }).catch(function(error) {
                throw sessionError(error);
            });
        }

        function applyTestSession(session) {
            session = session || {};
            activeTestSessionId = session.test_session_id || '';
            activeTestAssignmentId = session.assignment_id || '';
            testStartedAt = normalizeDateString(session.started_at);
        }

        function setTestNetworkStatus(message) {
            var status = document.getElementById('test-network-status');
            if (!status) return;
            status.textContent = message || '';
            status.hidden = !message;
        }

        function heartbeatErrorMarker(error) {
            if (!error) return '';
            return [error.code, error.message, error.errMsg, String(error)]
                .filter(Boolean)
                .join(' ');
        }

        function isTerminalHeartbeatError(error) {
            return /VOCABULARY_TEST_(SESSION_(EXPIRED|CLOSED|NOT_FOUND|MISMATCH)|ASSIGNMENT_(CANCELLED|NOT_FOUND)|DEVICE_BLOCKED)|VOCABULARY_CONTENT_OUTDATED|AUTH_REQUIRED|LOGIN_REQUIRED|UNAUTHENTICATED|INVALID_LOGIN_STATE|TOKEN[^ ]*EXPIRED|STUDENT_(NOT_LINKED|REQUIRED)/i.test(heartbeatErrorMarker(error));
        }

        function heartbeatRequestWithTimeout(sessionId) {
            var timeoutId = null;
            var timeout = new Promise(function(resolve, reject) {
                timeoutId = window.setTimeout(function() {
                    reject(new Error('Network request timed out.'));
                }, VOCABULARY_HEARTBEAT_REQUEST_TIMEOUT_MS);
            });
            return Promise.race([
                callVocabularyTestSession('heartbeatVocabularyTestSession', {
                    test_session_id: sessionId
                }),
                timeout
            ]).then(function(response) {
                clearTimeout(timeoutId);
                return response;
            }, function(error) {
                clearTimeout(timeoutId);
                throw error;
            });
        }

        function scheduleTestHeartbeatRetry(generation) {
            if (testHeartbeatRetryId || generation !== testHeartbeatGeneration) return;
            var delayIndex = Math.min(
                Math.max(0, testHeartbeatFailureCount - 1),
                VOCABULARY_HEARTBEAT_RETRY_DELAYS_MS.length - 1
            );
            testHeartbeatRetryId = window.setTimeout(function() {
                testHeartbeatRetryId = null;
                runTestHeartbeat(generation);
            }, VOCABULARY_HEARTBEAT_RETRY_DELAYS_MS[delayIndex]);
        }

        function runTestHeartbeat(generation) {
            if (generation !== testHeartbeatGeneration || testHeartbeatInFlight || testHeartbeatRetryId) return;
            if (!activeTestSessionId || !isCountedGroupCount(activeTestGroupCount)) return;
            var sessionId = activeTestSessionId;
            testHeartbeatInFlight = true;
            heartbeatRequestWithTimeout(sessionId).then(function() {
                if (generation !== testHeartbeatGeneration || sessionId !== activeTestSessionId) return;
                testHeartbeatFailureCount = 0;
                testLastHeartbeatSuccessAt = Date.now();
                setTestNetworkStatus('');
            }).catch(function(error) {
                if (generation !== testHeartbeatGeneration || sessionId !== activeTestSessionId) return;
                if (!testLocked || testSubmitting) return;
                if (isTerminalHeartbeatError(error)) {
                    endTestForIntegrity('heartbeat_failed', sessionError(error).message);
                    return;
                }
                testHeartbeatFailureCount += 1;
                if (Date.now() - testLastHeartbeatSuccessAt >= VOCABULARY_HEARTBEAT_RECOVERY_WINDOW_MS) {
                    endTestForIntegrity(
                        'heartbeat_timeout',
                        'The network was unavailable for too long. This vocabulary quiz was interrupted. Please start again when you are ready.'
                    );
                    return;
                }
                setTestNetworkStatus('Network unstable — reconnecting…');
                scheduleTestHeartbeatRetry(generation);
            }).then(function() {
                if (generation === testHeartbeatGeneration) testHeartbeatInFlight = false;
            });
        }

        function startTestHeartbeat() {
            stopTestHeartbeat();
            if (!activeTestSessionId || !isCountedGroupCount(activeTestGroupCount)) return;
            var generation = testHeartbeatGeneration;
            testLastHeartbeatSuccessAt = Date.now();
            testHeartbeatId = window.setInterval(function() {
                runTestHeartbeat(generation);
            }, VOCABULARY_HEARTBEAT_INTERVAL_MS);
        }

        function stopTestHeartbeat() {
            testHeartbeatGeneration += 1;
            if (testHeartbeatId) {
                clearInterval(testHeartbeatId);
                testHeartbeatId = null;
            }
            if (testHeartbeatRetryId) {
                clearTimeout(testHeartbeatRetryId);
                testHeartbeatRetryId = null;
            }
            testHeartbeatInFlight = false;
            testHeartbeatFailureCount = 0;
            testLastHeartbeatSuccessAt = 0;
            setTestNetworkStatus('');
        }

        function getResultAudioContext() {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;

        function unlockResultAudio() {

        function playResultTone(freq, start, duration, options) {
            var ctx = getResultAudioContext();
            if (!ctx) return;
            options = options || {};
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            var filter = ctx.createBiquadFilter();
            var now = ctx.currentTime;
            osc.type = options.type || 'sine';
            osc.frequency.setValueAtTime(freq, now + start);
            if (options.to) osc.frequency.exponentialRampToValueAtTime(options.to, now + start + duration);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(9000, now + start);
            gain.gain.setValueAtTime(.0001, now + start);
            gain.gain.exponentialRampToValueAtTime(options.volume || .14, now + start + .018);
            gain.gain.exponentialRampToValueAtTime(.0001, now + start + duration);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + start);
            osc.stop(now + start + duration + .02);
        }

        function playResultSequence(tones) {
            tones.forEach(function(tone) {

            window.MrCatVocabularyWorksheetPdf.downloadWorksheetPdf({

        function buildLetterGuide(word) {
            return String(word || '').split('').map(function(char) {
                return /[a-z]/i.test(char) ? '_' : char;

        function shuffleList(list) {
            var copy = list.slice();
            for (var i = copy.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = copy[i];
                copy[i] = copy[j];
                copy[j] = tmp;
            }
            return copy;
        }

        function seededNumber(seed) {
            var value = 2166136261;
            var text = String(seed || '');
            for (var i = 0; i < text.length; i++) {
                value ^= text.charCodeAt(i);
                value = Math.imul(value, 16777619);
            }
            return value >>> 0;
        }

        function shuffleChoiceWords(words, seed) {
            var original = (words || []).slice();
            var copy = original.slice();
            var state = seededNumber(seed);
            for (var i = copy.length - 1; i > 0; i--) {
                state = Math.imul(state ^ (state >>> 15), 2246822519) >>> 0;
                var j = state % (i + 1);
                var tmp = copy[i];
                copy[i] = copy[j];
                copy[j] = tmp;
            }
            if (copy.length > 1 && copy.every(function(word, index) { return word === original[index]; })) {
                copy.push(copy.shift());
            }
            return copy;
        }

            return '<span class="feedback-submitted">' + escapeHtml(submittedText) + '</span>' +
                '<span class="feedback-arrow">→</span>' +

            var trigger = card.querySelector('.blank-trigger');

                trigger.classList.add('selected', 'feedback', isCorrect ? 'feedback-correct' : 'feedback-wrong');

                reveal.innerHTML = renderPracticeExplanationContent(correctAnswer, explanation);

            var trigger = card.querySelector('.blank-trigger');
            var reveal = card.querySelector('.reveal');
            var explainButton = card.querySelector('.practice-explain-btn');

                input.value = '';
                input.disabled = false;
            }

        function findPracticeQuestion(groupId, questionKey) {
            var group = (unitData && unitData.quizGroups || []).find(function(item) { return item.id === groupId; });
            if (!group) return null;
            return (group.questions || []).find(function(question) {
                return (question.questionKey || (group.id + ':' + question.number)) === questionKey;
            }) || null;
        }

        function loadPracticeExplanation(button, card, reveal) {
            if (reveal.getAttribute('data-explanation-ready') === '1') return Promise.resolve();
            if (reveal.getAttribute('data-explanation-loading') === '1') return Promise.resolve();
            var groupId = button.getAttribute('data-group') || '';
            var questionKey = card.getAttribute('data-question-key') || '';
            var question = findPracticeQuestion(groupId, questionKey);
            if (question && Object.prototype.hasOwnProperty.call(question, 'answer')) {
                reveal.innerHTML = renderPracticeExplanationContent(question.answer, question.explanation || '');
                reveal.setAttribute('data-explanation-ready', '1');
                return Promise.resolve();
            }
            if (!window.MrCatCloud || typeof window.MrCatCloud.callFunction !== 'function') {
                reveal.innerHTML = 'Please log in to load the answer and explanation.';
                return Promise.resolve();
            }
            reveal.setAttribute('data-explanation-loading', '1');
            reveal.innerHTML = 'Loading answer and explanation...';
            var loginStatePromise;
            try {
                loginStatePromise = typeof window.MrCatCloud.getLoginState === 'function'
                    ? window.MrCatCloud.getLoginState()
                    : null;
            } catch (error) {
                loginStatePromise = Promise.reject(error);
            }
            return Promise.resolve(loginStatePromise)
                .then(function(state) {
                    if (!state) throw new Error('LOGIN_REQUIRED');
                    var input = card.querySelector('.answer-input');
                    var answers = {};
                    answers[questionKey] = input ? input.value || '' : '';
                    return window.MrCatCloud.callFunction('submitAttempt', {
                        set_id: setId,
                        mode: 'vocabulary_practice',
                        content_version: vocabularyContentVersion(),
                        answers: answers,
                        selected_group_count: 1,
                        selected_group_ids: [groupId]
                    });
                })
                .then(function(response) {
                    if (!response || !response.success) throw new Error(response && response.message || 'Unable to load explanation.');
                    var result = (response.question_results || []).find(function(item) {
                        return item.question_id === questionKey;
                    });
                    if (!result || response.feedback_locked) throw new Error('Explanation is not available yet.');
                    reveal.innerHTML = renderPracticeExplanationContent(result.correct_answer, result.explanation || '');
                    reveal.setAttribute('data-explanation-ready', '1');
                })
                .catch(function(error) {
                    reveal.innerHTML = escapeHtml(practiceCheckError(error).message);
                })
                .then(function() {
                    reveal.removeAttribute('data-explanation-loading');
                });
        }

        function togglePracticeExplanation(button) {
            var card = button.closest('.self-question, .test-question');
            if (!card) return;
            var reveal = card.querySelector('.reveal');
            if (!reveal) return;
            var willShow = !reveal.classList.contains('show');
            closePracticeExplanations(willShow ? card : null);
            reveal.classList.toggle('show', willShow);
            button.classList.toggle('active', willShow);
            card.classList.toggle('explanation-open', willShow);
            card.classList.remove('choice-open');
            if (willShow && card.classList.contains('self-question')) {
                loadPracticeExplanation(button, card, reveal);
            }
        }

        function practiceCheckError(error) {
            var message = error && (error.message || error.code || String(error)) || '';
            if (/VOCABULARY_CONTENT_OUTDATED/i.test(message)) {
                return new Error('This exercise has been updated. Reload the page before checking answers.');
            }
            if (/t\.scope|null is not an object|AUTH_REQUIRED|LOGIN_REQUIRED|INVALID_LOGIN_STATE/i.test(message)) {
                return new Error('Login session is not active. Please log in again, then reopen this vocabulary practice.');
            }
            return error instanceof Error ? error : new Error(message || 'Unable to check answers.');
        }

        function collectPracticeAnswers(group) {
            var answers = {};
            group.questions.forEach(function(question, index) {
                var card = document.getElementById('self-' + group.id + '-question-' + index);
                var key = question.questionKey || (group.id + ':' + question.number);
                answers[key] = card ? ((card.querySelector('.answer-input') || {}).value || '') : '';
            });
            return answers;
        }

        function hasLocalPracticeAnswers(group) {
            return !!group && (group.questions || []).every(function(question) {
                return Object.prototype.hasOwnProperty.call(question, 'answer');
            });
        }

        function buildLocalPracticeResponse(group, answers) {
            var correctCount = 0;
            var questionResults = (group.questions || []).map(function(question) {
                var key = question.questionKey || (group.id + ':' + question.number);
                var submitted = answers[key] || '';
                var correct = answerMatches(submitted, question.answer);
                if (correct) correctCount += 1;
                return {
                    question_id: key,
                    correct: correct,
                    correct_answer: answerText(question.answer),
                    explanation: question.explanation || ''
                };
            });
            return {
                success: true,
                correct_count: correctCount,
                question_count: questionResults.length,
                percentage: Math.round((correctCount / Math.max(1, questionResults.length)) * 100),
                question_results: questionResults
            };
        }

        function applyPracticeCheckResult(group, response) {
            if (!response || !response.success) throw new Error(response && response.message || 'Unable to check answers.');
            var resultMap = {};
            (response.question_results || []).forEach(function(item) { resultMap[item.question_id] = item; });
            var correctCount = 0;
            group.questions.forEach(function(question, index) {
                var card = document.getElementById('self-' + group.id + '-question-' + index);
                var input = card.querySelector('.answer-input');
                var key = question.questionKey || (group.id + ':' + question.number);
                var result = resultMap[key];
                card.classList.remove('correct', 'wrong', 'pending');
                card.classList.remove('choice-open');
                if (!result) return;
                if (result.correct) correctCount += 1;
                card.classList.add(result.correct ? 'correct' : 'wrong');
                showPracticeFeedback(card, (input && input.value || '').trim(), result.correct_answer, result.correct, result.explanation);
            });
            refreshChoiceAvailability(document.querySelector('#word-practice-panel .group-card'));
            updatePracticeScore(group.id, correctCount, group.questions.length, response.percentage);
            var btn = document.querySelector('[data-action="check"][data-group="' + group.id + '"]');
            if (btn) btn.hidden = true;
            var redo = document.querySelector('[data-action="redo-practice"][data-group="' + group.id + '"]');
            if (redo) redo.hidden = false;
        }

        function checkGroupAnswers(groupId) {
            var group = (unitData.quizGroups || []).find(function(item) { return item.id === groupId; });
            if (!group) return;
            var answers = collectPracticeAnswers(group);
            if (hasLocalPracticeAnswers(group)) {
                applyPracticeCheckResult(group, buildLocalPracticeResponse(group, answers));
                return;
            }
            if (!window.MrCatCloud || typeof window.MrCatCloud.callFunction !== 'function') {
                alert(practiceCheckError(new Error('LOGIN_REQUIRED')).message);
                return;
            }
            var loginStatePromise;
            try {
                loginStatePromise = typeof window.MrCatCloud.getLoginState === 'function'
                    ? window.MrCatCloud.getLoginState()
                    : null;
            } catch (error) {
                loginStatePromise = Promise.reject(error);
            }
            Promise.resolve(loginStatePromise)
                .then(function(state) {
                    if (!state) throw new Error('LOGIN_REQUIRED');
                    return window.MrCatCloud.callFunction('submitAttempt', {
                        set_id: setId,
                        mode: 'vocabulary_practice',
                        content_version: vocabularyContentVersion(),
                        answers: answers,
                        selected_group_count: 1,
                        selected_group_ids: [groupId]
                    });
                })
                .then(function(response) {
                    applyPracticeCheckResult(group, response);
                })

                });

        function clearGroupAnswers(groupId) {

        function renderDictation(words) {
            var root = document.getElementById('dictation-list');
            root.innerHTML = '<div class="word-table-wrap"><table class="dictation-table">' +
                '<thead><tr><th>Spell</th><th>Definition</th></tr></thead>' +
                '<tbody>' + words.map(function(word) {
                    var letters = word.word.split('').map(function(letter, index) {
                        return '<input class="letter-slot" type="text" maxlength="1" inputmode="text" autocomplete="off" data-index="' + index + '" aria-label="Letter ' + (index + 1) + '">';
                    }).join('');
                    return '<tr class="dictation-row" data-answer="' + word.word + '">' +
                        '<td>' +
                            '<div class="dictation-spell-head">' +
                                '<span class="part-of-speech">' + (word.partOfSpeech || '') + '</span>' +
                                pronunciationButtonHtml(word.word, false) +
                            '</div>' +
                            '<div class="dictation-input" style="--letter-count:' + word.word.length + '" data-answer="' + word.word + '">' + letters + '</div>' +
                            '<div class="reveal"></div>' +

                        '<td>' + (word.simpleDefinition || '') + '</td>' +
                    '</tr>';
                }).join('') + '</tbody></table></div>';
            wireDictationSlots(root);

        function getDictationValue(row) {
            return Array.from(row.querySelectorAll('.letter-slot')).map(function(input) {
                return input.value || '';
            }).join('');
        }

        function fillDictationSlots(wrapper, value) {
            var slots = Array.from(wrapper.querySelectorAll('.letter-slot'));
            slots.forEach(function(slot) {
                slot.value = '';
            });
            value.split('').slice(0, slots.length).forEach(function(char, index) {
                slots[index].value = char.toLowerCase();
            });
        }

        function wireDictationSlots(root) {
            root.querySelectorAll('.dictation-input').forEach(function(wrapper) {
                var slots = Array.from(wrapper.querySelectorAll('.letter-slot'));
                slots.forEach(function(slot, index) {
                    slot.addEventListener('input', function() {
                        var cleaned = slot.value.replace(/[^a-z]/gi, '').toLowerCase();
                        if (cleaned.length > 1) {
                            fillDictationSlots(wrapper, cleaned);
                            var nextIndex = Math.min(slots.length - 1, index + cleaned.length);
                            slots[nextIndex].focus();
                            return;
                        }
                        slot.value = cleaned;
                        if (cleaned && slots[index + 1]) slots[index + 1].focus();
                    });
                    slot.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && !slot.value && slots[index - 1]) {
                            slots[index - 1].focus();
                        }
                    });
                    slot.addEventListener('paste', function(e) {
                        e.preventDefault();
                        var text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^a-z]/gi, '').toLowerCase();
                        fillDictationSlots(wrapper, text);
                        var nextIndex = Math.min(slots.length - 1, index + text.length);
                        slots[nextIndex].focus();
                    });
                });
            });
        }

            if (start > end) {
                var tmp = start;
                start = end;

        function checkDictation() {
            document.querySelectorAll('.dictation-row').forEach(function(row) {
                var reveal = row.querySelector('.reveal');
                var answer = row.getAttribute('data-answer');
                row.classList.remove('correct', 'wrong', 'pending');
                var value = getDictationValue(row);
                if (normalizeAnswer(value) === normalizeAnswer(answer)) {
                    row.classList.add('correct');
                    reveal.classList.remove('show');
                } else {
                    row.classList.add(value.trim() ? 'wrong' : 'pending');

            document.querySelectorAll('.question-item.choice-open').forEach(function(card) {
                if (card !== exceptCard) card.classList.remove('choice-open');
            });
        }

        function refreshChoiceAvailability(groupCard) {
            if (!groupCard) return;
            var selectedValues = Array.from(groupCard.querySelectorAll('.question-item .answer-input'))
                .map(function(input) { return normalizeAnswer(input.value); })
                .filter(Boolean);

            groupCard.querySelectorAll('.question-item').forEach(function(card) {
                var ownValue = normalizeAnswer((card.querySelector('.answer-input') || {}).value);
                card.querySelectorAll('.choice-option[data-value]').forEach(function(option) {
                    if (option.hasAttribute('data-blank-choice')) {
                        option.hidden = false;
                        option.classList.remove('selected');
                        return;
                    }
                    var optionValue = normalizeAnswer(option.getAttribute('data-value'));
                    var usedElsewhere = selectedValues.indexOf(optionValue) !== -1 && optionValue !== ownValue;
                    option.hidden = usedElsewhere;
                    option.classList.toggle('selected', optionValue === ownValue);
                });
            });
        }

        function handleChoiceClick(e) {
            if (!e.target.closest('.practice-explain-btn') && !e.target.closest('.practice-explanation-popover')) {
                closePracticeExplanations(null);
            }

            var option = e.target.closest('.choice-option');
            if (option) {
                var optionCard = option.closest('.question-item');
                var input = optionCard.querySelector('.answer-input');
                var trigger = optionCard.querySelector('.blank-trigger');
                var isBlankChoice = option.hasAttribute('data-blank-choice');
                var value = isBlankChoice ? '' : (option.getAttribute('data-value') || '');
                input.value = value;
                trigger.textContent = value;
                trigger.classList.toggle('selected', !isBlankChoice);
                optionCard.querySelectorAll('.choice-option').forEach(function(btn) {
                    btn.classList.toggle('selected', !isBlankChoice && btn === option);
                });
                optionCard.classList.remove('choice-open');
                refreshChoiceAvailability(option.closest('.group-card'));
                return;
            }

            var trigger = e.target.closest('.blank-trigger');
            if (trigger && !trigger.disabled) {
                var triggerCard = trigger.closest('.question-item');
                var willOpen = !triggerCard.classList.contains('choice-open');
                closeChoicePanels(triggerCard);
                refreshChoiceAvailability(triggerCard.closest('.group-card'));
                triggerCard.classList.toggle('choice-open', willOpen);
                return;
            }

            if (!e.target.closest('.choice-panel')) {
                closeChoicePanels(null);
            }
        }

            var sticky = document.getElementById('test-sticky');

            var bestIndex = activeTestSetIndex || 0;
            var bestDistance = Infinity;
            document.querySelectorAll('.test-set-card').forEach(function(card) {
                var index = Number(card.getAttribute('data-test-set-index') || 0);
                var rect = card.getBoundingClientRect();
                if (rect.top <= anchorY && rect.bottom >= anchorY) {
                    bestIndex = index;
                    bestDistance = 0;
                    return;
                }
                var distance = Math.abs(rect.top - anchorY);
                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestIndex = index;
                }
            });
            return bestIndex;
        }

        function playTimeUpSound() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            try {
                var ctx = new AudioContext();
                var now = ctx.currentTime;
                [740, 620, 520].forEach(function(freq, index) {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    var start = now + index * 0.16;
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.16, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.14);
                });
                setTimeout(function() { ctx.close(); }, 800);
            } catch (e) {}
        }

        function restoreTestDraft() {
            if (params.get('retry') === '1') {
                clearTestDraft();
                return Promise.resolve(false);
            }
            var draft = null;
            try { draft = JSON.parse(localStorage.getItem(testDraftKey()) || 'null'); } catch (e) {}
            if (!draft || !draft.group_ids || !draft.group_ids.length || !draft.started_at) return Promise.resolve(false);
            var elapsed = Math.max(0, Math.round((Date.now() - new Date(draft.started_at).getTime()) / 1000));
            var draftGroupCount = Number(draft.group_count || draft.group_ids.length || 0);
            var draftHasServerSession = isCountedGroupCount(draftGroupCount) && !!draft.test_session_id;
            var savedDraftTotalSeconds = Number(draft.total_seconds || testDurationSecondsForGroupCount(draftGroupCount));
            var draftTotalSeconds = draftHasServerSession
                ? savedDraftTotalSeconds
                : Math.min(savedDraftTotalSeconds, testDurationSecondsForGroupCount(draftGroupCount));
            var remaining = Math.max(0, draftTotalSeconds - elapsed);
            if (remaining <= 0) {
                clearTestDraft();
                return Promise.resolve(false);
            }
            var groupMap = {};
            (unitData.quizGroups || []).forEach(function(group) { groupMap[group.id] = group; });
            var selected = draft.group_ids.map(function(id) { return groupMap[id]; }).filter(Boolean);
            if (!selected.length) return Promise.resolve(false);
            testStartedAt = draft.started_at;
            if (isCountedGroupCount(Number(draft.group_count || selected.length))) {
                if (!draft.test_session_id) {
                    clearTestDraft();
                    return Promise.resolve(false);
                }
                activeTestSessionId = draft.test_session_id;
                activeTestAssignmentId = draft.assignment_id || '';
                return resumeVocabularyTestSession(draft.test_session_id).then(function(response) {
                    var seconds = response.remaining_seconds == null ? remaining : Math.max(1, Number(response.remaining_seconds || 0));
                    return renderStartedTest(selected, draft.answers || {}, seconds, false, 'test');
                }).catch(function() {
                    activeTestSessionId = '';
                    activeTestAssignmentId = '';
                    clearTestDraft();
                    return false;
                });
            }
            activeTestSessionId = '';
            activeTestAssignmentId = '';
            return Promise.resolve(renderStartedTest(selected, draft.answers || {}, remaining, false, 'test'));
        }

        function fetchPrefillAttempt(force, attemptIdOverride) {
            var targetAttemptId = attemptIdOverride || prefillAttemptId;
            if (!targetAttemptId || !window.MrCatCloud) return Promise.resolve(false);
            if (params.get('retry') === '1') return Promise.resolve(false);
            try {
                if (!force && localStorage.getItem(testDraftKey())) return Promise.resolve(false);
            } catch (e) {}
            var prefill = window.MrCatCloud.callFunction('getDashboard', {
                action: 'getAttemptForRetry',
                attempt_id: targetAttemptId
            });
            var review = force ? window.MrCatCloud.callFunction('getDashboard', {
                action: 'getAttemptReview',
                attempt_id: targetAttemptId
            }).catch(function() { return null; }) : Promise.resolve(null);
            return Promise.all([prefill, review]).then(function(results) {
                var result = results[0];
                if (!result || !result.success || !result.attempt || !result.attempt.answers) return false;
                var groupIds = [];
                Object.keys(result.attempt.answers).forEach(function(key) {
                    var groupId = key.split(':')[0];
                    if (groupId && groupIds.indexOf(groupId) === -1) groupIds.push(groupId);
                });
                var groupMap = {};
                (unitData.quizGroups || []).forEach(function(group) { groupMap[group.id] = group; });
                var selected = groupIds.map(function(id) { return groupMap[id]; }).filter(Boolean);
                return startTestWithGroups(selected, result.attempt.answers).then(function(started) {
                    if (started && results[1] && results[1].review) markHistoryReview(results[1].review);
                    if (started && focusQuestionId) {
                        window.setTimeout(function() { jumpToQuestion(focusQuestionId); }, 160);
                    }
                    return started;
                });
            }).catch(function() { return false; });
        }

        function markHistoryReview(review) {
            (review.answers || []).forEach(function(item) {
                var key = item.question_id;
                var card = document.querySelector('[data-question-key="' + CSS.escape(key) + '"]');
                if (!card) return;
                card.classList.remove('correct', 'wrong', 'pending');
                if (card.classList.contains('test-question')) card.classList.add('test-reviewed');
                card.classList.add(item.correct ? 'correct' : 'wrong');
                if (card.querySelector('[data-history-dispute="' + CSS.escape(key) + '"]')) return;
                var note = document.createElement('div');
                note.className = 'history-dispute-note ' + (item.correct ? 'correct' : 'wrong');
                note.setAttribute('data-history-dispute', key);
                note.innerHTML = '<strong>' + (item.correct ? 'Correct in history' : 'Incorrect in history') + '</strong>';
                card.appendChild(note);
            });
        }

        function submitVocabularyTest(questions, options) {
            options = options || {};
            testSubmitting = true;
            var answers = {};
            questions.forEach(function(card) {
                var key = card.getAttribute('data-question-key');
                var input = card.querySelector('.answer-input');
                answers[key] = input ? input.value : '';
            });

            var submitButton = document.getElementById('submit-test-btn');
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            window.MrCatCloud.callFunction('submitAttempt', {
                set_id: setId,
                assignment_id: activeTestMode === 'practice' ? null : activeTestAssignmentId || null,
                mode: activeTestMode === 'practice' ? 'vocabulary_practice_timed' : 'vocabulary_test',
                content_version: vocabularyContentVersion(),
                test_session_id: activeTestMode === 'practice' ? null : activeTestSessionId || null,
                answers: answers,
                selected_group_count: activeTestGroupCount,
                selected_group_ids: activeTestGroups.map(function(group) { return group.id; }),
                started_at: testStartedAt,
                duration_seconds: testStartedAt
                    ? Math.max(0, Math.round((Date.now() - new Date(testStartedAt).getTime()) / 1000))
                    : null
            }).then(function(response) {
                if (!response || !response.success) {
                    throw new Error(response && response.message || 'Unable to submit this test.');
                }
                if (activeTestMode !== 'practice') {
                    updateHistoryFromResponse(response);
                    assignmentStatus = response.mastered ? 'mastered' : response.passed ? 'passed' : assignmentStatus;
                    answerRevealAvailable = response.passed && !response.feedback_locked;
                }
                updateHistoryToolbar();
                var resultMap = {};
                (response.question_results || []).forEach(function(item) {
                    resultMap[item.question_id] = item;
                });
                questions.forEach(function(card) {
                    var key = card.getAttribute('data-question-key');
                    var result = resultMap[key];
                    var input = card.querySelector('.answer-input');
                    var trigger = card.querySelector('.blank-trigger');
                    var reveal = card.querySelector('.reveal');
                    var submitted = (input && input.value || '').trim();
                    card.classList.remove('correct', 'wrong', 'pending', 'choice-open');
                    if (input) input.disabled = true;
                    if (trigger) trigger.disabled = true;
                    if (reveal) reveal.classList.remove('show');
                    if (!result) return;
                    card.classList.add(result.correct ? 'correct' : 'wrong');
                    if (!response.feedback_locked) {
                        card.classList.add('test-reviewed');
                        if (reveal && result.explanation) reveal.innerHTML = escapeHtml(result.explanation);
                        showPracticeFeedback(card, submitted, result.correct_answer, result.correct, result.explanation);
                        if (reveal) reveal.setAttribute('data-answer-reveal', '1');
                    }
                });

                var summary = document.getElementById('test-summary');
                summary.textContent = '';
                summary.classList.remove('show');
                showResultOverlay(response);
                testReviewMode = true;
                testWordBankManualState = false;
                setTestWordBankOpen(false);
                setTestStickyReviewControls(response.correct_count + ' / ' + response.question_count);
                submitButton.style.display = 'none';
                document.getElementById('redo-test-btn').style.display = 'none';
                testRedoAvailable = true;
                updateHistoryToolbar();
                setTestLocked(false);
                stopTestHeartbeat();
                activeTestSessionId = '';
                activeTestAssignmentId = '';
                testSubmitting = false;
                clearTestDraft();
            }).catch(function(error) {
                testSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = activeTestMode === 'practice' ? 'Submit Practice' : 'Submit';
                if (isTerminalHeartbeatError(error)) {
                    stopTestHeartbeat();
                    clearInterval(testTimerId);
                    setTestLocked(false);
                    activeTestSessionId = '';
                    activeTestAssignmentId = '';
                    clearTestDraft();
                } else if (testLocked && options.remaining_seconds > 0) {
                    startTimer(options.remaining_seconds);
                    startTestHeartbeat();
                }
                alert(sessionError(error, 'Unable to submit. Please try again.').message);
            });
        }
