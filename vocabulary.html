            window.addEventListener('beforeunload', function(event) {
                saveTestDraft();
                if (isActiveCountedTest()) {
                    abandonVocabularyTestSession('page_unload');
                    clearTestDraft();
                    return;
                }
                if (!testLocked) return;
                event.preventDefault();
                event.returnValue = '';
                return '';
            });
            window.addEventListener('popstate', function() {
                if (!testLocked) return;
                try {
                    window.history.pushState({ vocabTestLocked: true }, '', window.location.href);
                } catch (e) {}
                showTestLockNotice();
            });
        }

        function checkVocabularyPageAccess() {
            if (teacherMode || !window.MrCatCloud || typeof window.MrCatCloud.getLoginState !== 'function') {
                return Promise.resolve(true);
            }
            return window.MrCatCloud.getLoginState().then(function(state) {
                if (!state) return true;
                return window.MrCatCloud.callFunction('submitAttempt', {
                    action: 'checkVocabularyTestAccess',
                    set_id: setId,
                    assignment_id: assignmentId || null
                }).then(function(response) {
                    if (response && response.success === false) {
                        var responseError = new Error(response.message || response.code || 'Unable to verify vocabulary test access.');
                        if (response.code) responseError.code = response.code;
                        throw responseError;
                    }
                    return true;
                });
            }).catch(function(error) {
                var marker = error && (error.code || error.message || error.errMsg || String(error)) || '';
                if (/VOCABULARY_TEST_DEVICE_BLOCKED|already taking a vocabulary test|already in progress/i.test(marker)) {
                    var blocked = new Error(error.message || 'This account is already taking a vocabulary test on another device or browser tab.');
                    blocked.code = 'VOCABULARY_TEST_DEVICE_BLOCKED';
                    throw blocked;
                }
                return true;
            });
        }

        function renderUnit(data) {
            unitData = data;
            renderHero(data);
            activeWordGroupId = '';
            activePracticeGroupId = '';
            renderFilteredWords();
            renderWordPracticePanel();
            renderDictationRangeOptions(data.words || []);
            renderClozePracticeOptions(data.quizGroups || []);
            renderTestOptions(data.quizGroups || []);
            wireEvents();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            if (teacherMode) {
                renderTeacherAnswerToolbar();
                document.getElementById('submit-test-btn').disabled = true;
                document.getElementById('submit-test-btn').textContent = 'Teacher Preview';
            } else {
                renderHistoryToolbar();
                if (assignmentEntryMode === 'learn') {
                    if (focusQuestionId) jumpToQuestion(focusQuestionId);
                } else if (focusQuestionId) {
                    restoreTestDraft().then(function(restored) {
                        if (restored) {
                            window.setTimeout(function() { jumpToQuestion(focusQuestionId); }, 160);
                            return;
                        }
                        fetchPrefillAttempt().then(function(started) {
                            if (!started && focusQuestionId) jumpToQuestion(focusQuestionId);
                        });
                    });
                } else {
                    restoreTestDraft().then(function(restored) {
                        if (restored) return;
                        fetchPrefillAttempt();
                    });
                }
            }
        }

        updateIdentityStatus();

        function loadVocabularyUnit() {
            return fetch('content/vocabulary/' + encodeURIComponent(setId) + '.json?v=' + encodeURIComponent(contentVersion()))
                .then(function(response) {
                    if (!response.ok) throw new Error('Vocabulary unit not found.');
                    return response.json();
                })
                .catch(function(fetchError) {
                    return injectScript('content/vocabulary/' + encodeURIComponent(setId) + '.js?v=' + encodeURIComponent(contentVersion()))
                        .then(function() {
                            var fallback = window.__VOCABULARY_UNITS__ && window.__VOCABULARY_UNITS__[setId];
                            if (!fallback) throw fetchError;
                            return fallback;
                        });
                });
        }

        loadVocabularyUnit()
            .then(function(data) {
                return checkVocabularyPageAccess().then(function() {
                    renderUnit(data);
                });
            })
            .catch(function(error) {
                showError(error.message || 'Unable to load vocabulary unit.');
            });
    </script>
</body>
</html>
