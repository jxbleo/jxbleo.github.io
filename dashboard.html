<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f8f5">
    <title>Dashboard | Mr. Cat Academy</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dse-apple-touch-icon.png">
    <link rel="manifest" href="site-dse.webmanifest">
    <link rel="stylesheet" href="assets/css/app.css?v=20260621-1">
</head>
<body class="app-page">
    <main class="app-shell">
        <header class="app-header">
            <p class="app-brand">Mr. Cat Academy</p>
            <div class="identity-cluster">
                <button class="icon-pill-button student-message-button" id="student-message-button" type="button" aria-label="Messages" aria-expanded="false">
                    <span aria-hidden="true">!</span>
                    <span class="notice-dot danger" id="student-message-count" hidden>0</span>
                </button>
                <button class="student-chip account-chip-button" id="identity-chip" type="button" aria-expanded="false">Loading...</button>
            </div>
        </header>

        <section class="account-panel" id="student-account-panel" hidden>
            <div class="account-panel-head">
                <div>
                    <p class="eyebrow accent">PERSONAL CENTER</p>
                </div>
                <button class="create-student-close" id="student-account-close" type="button" aria-label="Close account panel">x</button>
            </div>
            <div id="profile-content"></div>
        </section>

        <section class="hero-card">
            <h1 id="greeting">Hello.</h1>
            <p id="hero-copy">Your assignments and learning resources live here.</p>
        </section>

        <nav class="dashboard-tabs" aria-label="Dashboard sections">
            <button class="tab-button active" type="button" data-view="assignments">Assignments</button>
            <button class="tab-button" type="button" data-view="words">My Words</button>
            <button class="tab-button" type="button" data-view="resources">Library</button>
        </nav>

        <section class="dashboard-view" id="view-assignments">
            <div id="assignment-content">
                <div class="empty-card loading-card">Loading assignments...</div>
            </div>
        </section>

        <section class="dashboard-view" id="view-resources" hidden>
            <div class="resource-tools">
                <input class="resource-search" id="resource-search" type="search" placeholder="Search title, course or type...">
            </div>
            <div class="library-tab-bar" id="student-library-tab-bar">
                <button class="library-tab-btn active" data-tab="general">General Practice</button>
                <button class="library-tab-btn" data-tab="exam">Exam Practice</button>
                <button class="library-tab-btn" data-tab="lessons">Lessons</button>
            </div>
            <div class="sub-tab-bar" id="student-sub-tab-bar"></div>
            <div class="library-year-bar" id="student-year-bar"></div>
            <div id="student-library-content">
                <p class="section-description">Loading...</p>
            </div>
        </section>

        <section class="dashboard-view" id="view-words" hidden>
            <div class="section-heading">
                <div>
                    <h2>My Words</h2>
                    <p>Your saved words and phrases.</p>
                </div>
            </div>
            <div id="my-words-content"></div>
        </section>
    </main>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
    <script src="assets/js/config.public.js?v=20260616-1"></script>
    <script src="assets/js/cloudbase-client.js?v=20260611-2"></script>
    <script src="assets/js/personal-vocab.js?v=20260618-1"></script>
    <script src="assets/js/auth.js?v=20260611-2"></script>
    <script src="assets/js/dashboard.js?v=20260621-1"></script>
</body>
</html>
