<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f8f5">
    <title>Dashboard | Mr. Cat Academy</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dse-apple-touch-icon.png">
    <link rel="manifest" href="site-dse.webmanifest">
    <link rel="stylesheet" href="assets/css/app.css?v=20260711-3">
</head>
<body class="app-page">
    <main class="app-shell">
        <header class="app-header">
            <p class="app-brand">Mr. Cat Academy</p>
            <div class="identity-cluster">
                <button class="icon-pill-button student-message-button" id="student-message-button" type="button" aria-label="Notifications" aria-expanded="false">
                    <span aria-hidden="true">!</span>
                    <span class="notice-dot danger" id="student-message-count" hidden>0</span>
                </button>
                <button class="student-chip account-chip-button" id="identity-chip" type="button" aria-expanded="false">Loading...</button>
            </div>
        </header>

        <section class="account-panel" id="student-account-panel" hidden>
            <div class="account-panel-head">
                <div>
                    <p class="eyebrow accent">PERSONAL CENTER</p>
                </div>
                <button class="create-student-close" id="student-account-close" type="button" aria-label="Close account panel">x</button>
            </div>
            <div id="profile-content"></div>
        </section>

        <section class="hero-card student-progress-hero">
            <div class="hero-progress-head">
                <div class="hero-copy-stack">
                    <h1 id="greeting">Hello.</h1>
                    <p id="hero-copy">Your assignments and learning resources live here.</p>
                </div>
                <div class="hero-progress-stats is-loading" id="hero-progress-stats" aria-label="Assignment summary">
                    <div class="hero-meter-row">
                        <strong class="progress-skeleton-text">-- / --</strong>
                    </div>
                    <div class="hero-meter-track loading-track" aria-hidden="true"><i></i></div>
                    <div class="hero-meter-legend">
                        <span><b>--</b> finished</span>
                        <span><b>--</b> to do</span>
                    </div>
                </div>
            </div>
            <div class="progress-board is-loading" id="progress-board" aria-label="Four week assignment progress">
                <section class="progress-map-panel">
                    <div class="progress-dot-map progress-dot-map-loading" aria-hidden="true">
                        <span></span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                        <span>W--</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                        <span>W--</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                        <span>W--</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                        <span>W--</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                    </div>
                </section>
                <section class="progress-detail-panel">
                    <div class="progress-detail-list">
                        <div class="progress-detail-loading"></div>
                        <div class="progress-detail-loading short"></div>
                        <div class="progress-loading-copy">Loading progress</div>
                    </div>
                </section>
            </div>
        </section>

        <nav class="dashboard-tabs" aria-label="Dashboard sections">
            <button class="tab-button active" type="button" data-view="assignments">Assignments</button>
            <button class="tab-button" type="button" data-view="words">My Words</button>
            <button class="tab-button" type="button" data-view="resources">Library</button>
        </nav>

        <section class="dashboard-view" id="view-assignments">
            <div id="assignment-content">
                <div class="empty-card loading-card">Loading assignments...</div>
            </div>
        </section>

        <section class="dashboard-view" id="view-resources" hidden>
            <div class="resource-tools">
                <input class="resource-search" id="resource-search" type="search" placeholder="Search title, course or type...">
            </div>
            <div class="library-tab-bar" id="student-library-tab-bar">
                <button class="library-tab-btn active" data-tab="general">Practice</button>
                <button class="library-tab-btn" data-tab="exam">Exam</button>
            </div>
            <div class="sub-tab-bar" id="student-sub-tab-bar"></div>
            <div class="library-year-bar" id="student-year-bar"></div>
            <div id="student-library-content">
                <p class="section-description">Loading...</p>
            </div>
        </section>

        <section class="dashboard-view" id="view-words" hidden>
            <div class="section-heading">
                <div>
                    <h2>My Words</h2>
                    <p>Your saved words and phrases.</p>
                </div>
            </div>
            <div id="my-words-content"></div>
        </section>
    </main>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
    <script src="assets/js/config.public.js?v=20260711-1"></script>
    <script src="assets/js/cloudbase-client.js?v=20260707-4"></script>
    <script src="assets/js/personal-vocab.js?v=20260701-1"></script>
    <script src="assets/js/auth.js?v=20260707-4"></script>
    <script src="assets/js/dashboard.js?v=20260711-3"></script>
</body>
</html>
