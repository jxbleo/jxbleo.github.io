<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/touch-behavior.css?v=20260723-1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f8f5">
    <title>Dashboard | Mr. Cat Academy</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dse-apple-touch-icon.png">
    <link rel="manifest" href="site-dse.webmanifest">
    <link rel="stylesheet" href="assets/css/app.css?v=20260806-11">
    <link rel="stylesheet" href="assets/css/liquid-glass-shell.css?v=20260806-1">
    <link rel="stylesheet" href="assets/css/spatial-workspace.css?v=20260726-5">
</head>
<body class="app-page liquid-glass-shell liquid-glass-dashboard">
    <main class="app-shell">
        <header class="app-header">
            <div class="student-primary-cluster">
                <button class="icon-pill-button student-message-button student-todo-button" id="student-message-button" type="button" aria-label="To Do List" aria-expanded="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="m3.5 6 1.7 1.7L8.5 4.5M11 6h9M3.5 12l1.7 1.7 3.3-3.2M11 12h9M3.5 18l1.7 1.7 3.3-3.2M11 18h9"></path>
                    </svg>
                    <span class="notice-dot danger" id="student-message-count" hidden>0</span>
                </button>
                <button class="icon-pill-button student-replies-button student-header-replies-button" id="student-replies-button" type="button" aria-label="Teacher replies" aria-expanded="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M21 11.5c0 4.4-4 8-9 8-1.4 0-2.8-.3-4-.8l-5 1.8 1.8-4.1A7.4 7.4 0 0 1 3 11.5c0-4.4 4-8 9-8s9 3.6 9 8Z"></path>
                        <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"></path>
                    </svg>
                    <span class="notice-dot danger" hidden>0</span>
                </button>
            </div>
            <div class="identity-cluster">
                <button class="icon-pill-button student-calendar-button" id="student-calendar-button" type="button" aria-label="Progress calendar" aria-expanded="false" aria-controls="student-calendar-overlay">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <rect x="3.5" y="5.5" width="17" height="15" rx="3"></rect>
                        <path d="M8 3.5v4M16 3.5v4M3.5 10h17"></path>
                    </svg>
                    <span class="student-calendar-date" id="student-calendar-date" aria-hidden="true"></span>
                </button>
                <a class="icon-pill-button student-words-button" href="my-words.html" aria-label="My Words">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M6 3.5h10.5A1.5 1.5 0 0 1 18 5v14.5H7.5A2.5 2.5 0 0 1 5 17V5.5a2 2 0 0 1 1-2Z"></path>
                        <path d="M8 3.5v16M10.5 8h4.5M10.5 11.5h4.5"></path>
                    </svg>
                </a>
                <button class="student-chip account-chip-button" id="identity-chip" type="button" aria-expanded="false">Loading...</button>
            </div>
        </header>

        <section class="account-panel student-account-overlay" id="student-account-panel" hidden>
            <div class="student-account-stack" role="dialog" aria-modal="true" aria-labelledby="student-account-title">
                <section class="student-account-dialog">
                    <div class="account-panel-head">
                        <div>
                            <p class="eyebrow accent" id="student-account-title">PERSONAL CENTER</p>
                        </div>
                    </div>
                    <div id="profile-content"></div>
                </section>
                <button class="student-message-close student-account-outside-close" id="student-account-close" type="button" aria-label="Close Personal Center">Close</button>
            </div>
        </section>

        <section class="student-star-overlay" id="student-star-overlay" hidden>
            <div class="student-star-stack" role="dialog" aria-modal="true" aria-labelledby="student-star-title">
                <section class="student-star-dialog">
                    <div id="student-star-content"></div>
                </section>
                <button class="student-star-outside-close" id="student-star-close" type="button">Close</button>
            </div>
        </section>

        <section class="logout-confirm-overlay" id="logout-confirm-overlay" hidden>
            <div class="logout-confirm-stack" role="dialog" aria-modal="true" aria-labelledby="logout-confirm-title" aria-describedby="logout-confirm-message">
                <section class="logout-confirm-dialog">
                    <div class="account-flow-title-row">
                        <button class="account-star-back" id="logout-confirm-back" type="button" aria-label="Back to Personal Center">‹</button>
                        <p class="eyebrow accent" id="logout-confirm-title">LOG OUT</p>
                        <span class="account-flow-title-spacer" aria-hidden="true"></span>
                    </div>
                    <div class="logout-confirm-copy">
                        <strong>Log out of your account?</strong>
                        <p id="logout-confirm-message">You will return to the login page and need to sign in again.</p>
                    </div>
                    <div class="logout-confirm-actions">
                        <button class="outline-button" id="logout-confirm-cancel" type="button">Cancel</button>
                        <button class="danger-button" id="logout-confirm-submit" type="button">Log out</button>
                    </div>
                </section>
                <button class="student-message-close logout-confirm-outside-close" id="logout-confirm-close" type="button" aria-label="Close logout confirmation and Personal Center">Close</button>
            </div>
        </section>

        <section class="hero-card student-progress-hero">
            <section class="student-welcome-panel" aria-labelledby="student-greeting-primary">
                <div class="student-welcome-copy">
                    <h1 class="student-greeting-line" id="student-greeting-line"><span id="student-greeting-primary">Hello.</span></h1>
                    <p class="student-motivation" id="student-greeting-motivation">Your next step starts here.</p>
                    <span class="sr-only" id="student-greeting-accessible" role="status" aria-live="polite" aria-atomic="true">Hello. Your next step starts here.</span>
                </div>
            </section>
            <div class="weekly-focus-progress is-loading" id="weekly-focus-progress" aria-label="Weekly assignment progress" aria-busy="true">
                <div class="weekly-progress-row weekly-progress-skeleton" aria-hidden="true">
                    <div class="weekly-progress-heading">
                        <span class="weekly-progress-label">THIS WEEK</span>
                        <span class="weekly-progress-track"><i></i></span>
                    </div>
                </div>
                <span class="sr-only" role="status">Loading weekly assignment progress.</span>
            </div>
        </section>

        <section class="dashboard-view" id="view-assignments" hidden>
            <div id="assignment-content">
                <div class="empty-card loading-card">Loading assignments...</div>
            </div>
        </section>

        <section class="dashboard-view student-library-workspace" id="view-resources">
            <header class="student-library-heading">
                <div>
                    <div class="student-library-title-line">
                        <h2>Library</h2>
                        <div class="student-library-category-menu" id="student-library-category-menu">
                            <button class="student-library-category-trigger" id="student-library-category-trigger" type="button" aria-haspopup="true" aria-controls="student-sub-tab-bar" aria-expanded="false">
                                <span class="student-library-category-separator" aria-hidden="true">/</span>
                                <span id="student-library-category-label">BBC2024</span>
                                <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                    <path d="m5.5 7.5 4.5 4.5 4.5-4.5"></path>
                                </svg>
                            </button>
                            <div class="sub-tab-bar student-library-category-popover" id="student-sub-tab-bar" aria-label="Library categories" aria-hidden="true" hidden></div>
                        </div>
                    </div>
                </div>
                <div class="student-library-toolbar">
                    <nav class="student-library-dock" id="student-library-dock" aria-label="Library search">
                        <button class="student-library-search-trigger" id="resource-search-toggle" type="button" aria-label="Search Library" aria-controls="resource-search" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <circle cx="11" cy="11" r="6.5"></circle>
                                <path d="m16 16 4 4"></path>
                            </svg>
                        </button>
                        <span class="sr-only" id="student-library-label">Library</span>
                        <div class="student-library-search-panel" id="student-library-search-panel" aria-hidden="true">
                            <label class="sr-only" for="resource-search">Search Library</label>
                            <input class="resource-search" id="resource-search" type="search" placeholder="Search title, set or course..." autocomplete="off" disabled>
                            <button class="student-library-search-close" id="resource-search-close" type="button" aria-label="Close Library search" disabled>&times;</button>
                        </div>
                    </nav>
                    <div class="library-tab-bar" id="student-library-tab-bar">
                        <button class="library-tab-btn active" data-tab="general">Practice</button>
                        <button class="library-tab-btn" data-tab="exam">Exam</button>
                    </div>
                </div>
            </header>
            <div class="library-year-bar" id="student-year-bar"></div>
            <div id="student-library-content">
                <p class="section-description">Loading...</p>
            </div>
        </section>

        <section class="student-calendar-overlay" id="student-calendar-overlay" hidden>
            <div class="student-calendar-stack" role="dialog" aria-modal="true" aria-label="Completion calendar">
                <section class="student-calendar-dialog">
                    <div class="student-calendar-scroll" id="student-calendar-scroll">
                        <div id="student-calendar-content"></div>
                    </div>
                </section>
                <button class="student-calendar-outside-close" id="student-calendar-close" type="button">Close</button>
            </div>
        </section>
    </main>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
    <script src="assets/js/config.public.js?v=20260803-1"></script>
    <script src="assets/js/cloudbase-client.js?v=20260801-4"></script>
    <script src="assets/js/personal-vocab.js?v=20260725-1"></script>
    <script src="assets/js/auth.js?v=20260707-4"></script>
    <script src="assets/js/content-editions.js?v=20260804-1"></script>
    <script src="assets/js/dashboard.js?v=20260806-11"></script>
    <script src="assets/js/liquid-glass-shell.js?v=20260713-1"></script>
</body>
</html>
