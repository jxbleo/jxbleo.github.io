<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC 6 Minute English - Listening Practice</title>
    <style>
        :root {
            --primary: #16312f;
            --accent: #0f766e;
            --accent-bright: #14b8a6;
            --bg: #f4fbf7;
            --card-bg: rgba(255,255,255,0.78);
            --text-main: #1f2937;
            --text-light: #64748b;
            --border-color: rgba(15, 118, 110, 0.16);
            --correct-bg: #e8f8f5;
            --wrong-bg: #fdf2e9;
            --warm: #f97316;
            --warm-soft: #fff2df;
            --ink: #18352f;
            --muted: #6d807a;
            --line: rgba(15, 118, 110, 0.16);
            --border: rgba(15, 118, 110, 0.16);
            --bg-page: #f4fbf7;
            --text-primary: #1f2937;
            --text-secondary: #64748b;
            --text-muted: #64748b;
            --accent-dark: #0b5f59;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(254, 243, 199, 0.9) 0, transparent 28%),
                radial-gradient(circle at 90% 4%, rgba(209, 250, 229, 0.9) 0, transparent 24%),
                linear-gradient(180deg, #f8fafc 0%, #eef8f4 100%);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 28px 16px 64px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: transparent;
            padding: 0;
        }

        .lesson-hero {
            position: relative;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(135deg, #123f3c 0%, #0f766e 54%, #14b8a6 100%);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 30px;
            padding: 34px 30px 28px;
            margin-bottom: 16px;
            box-shadow: 0 24px 60px rgba(15, 118, 110, 0.22);
        }

        .lesson-hero::before,
        .lesson-hero::after {
            content: '';
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .lesson-hero::before {
            width: 260px;
            height: 260px;
            right: -64px;
            top: -78px;
            background: radial-gradient(circle, rgba(255, 237, 213, 0.6), transparent 66%);
        }

        .lesson-hero::after {
            width: 190px;
            height: 190px;
            right: 180px;
            bottom: -90px;
            background: radial-gradient(circle, rgba(204, 251, 241, 0.42), transparent 68%);
        }

        .hero-kicker {
            display: inline-flex;
            position: relative;
            z-index: 1;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.24);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            color: inherit;
            text-align: center;
            border-bottom: none;
            padding-bottom: 0;
            margin: 10px 0 6px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.02;
            letter-spacing: -0.055em;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            position: relative;
            z-index: 1;
            text-align: center;
            color: rgba(255,255,255,0.72);
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .hero-meta {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            color: rgba(255,255,255,0.82);
            font-weight: 700;
            font-size: 0.94rem;
        }

        .hero-tools {
            position: relative;
            z-index: 1;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .hero-tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 999px;
            color: #fff;
            background: rgba(255,255,255,0.14);
            font-size: 0.86rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .hero-tool-btn svg {
            width: 17px;
            height: 17px;
            stroke-width: 2.4;
        }

        .hero-tool-btn:hover {
            transform: translateY(-1px);
        }

        #bbc-audio {
            display: none;
        }

        .sticky-player {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
        }

        .player-btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 900;
            transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
        }

        .play-btn {
            width: 46px;
            height: 46px;
            background: #fff;
            color: var(--accent);
            font-size: 1rem;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
        }

        .player-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .back-btn {
            padding: 10px 13px;
            background: rgba(255,255,255,0.16);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.26);
        }

        .back-btn:disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .progress-wrap {
            min-width: 0;
        }

        .progress-wrap {
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255,255,255,0.22);
            pointer-events: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #fde68a, #fff);
            pointer-events: none;
        }

        .time-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            color: rgba(255,255,255,0.82);
            font-size: 0.82rem;
            font-weight: 800;
        }

        .time-row span:last-child {
            text-align: right;
        }

        .sticky-player {
            position: sticky;
            top: 0;
            z-index: 800;
            margin: 0 0 24px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(18, 63, 60, 0.94);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(16px);
        }

        .sticky-identity {
            color: rgba(255,255,255,0.78);
            text-align: center;
            white-space: nowrap;
        }

        .sticky-player .play-btn {
            width: 38px;
            height: 38px;
        }

        .sticky-player .back-btn {
            width: 38px;
            height: 38px;
            background: #fff;
            color: var(--accent);
            font-size: 0.82rem;
            padding: 0;
            border: none;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        h2 {
            color: var(--primary);
            font-size: 1.4em;
            margin-top: 40px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        h3 {
            color: var(--accent);
            font-size: 1.1em;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .content-card {
            background: rgba(255,255,255,0.74);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 26px;
            margin-top: 18px;
            box-shadow: 0 16px 38px rgba(15, 23, 42, 0.07);
            backdrop-filter: blur(18px);
        }

        .quiz-toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 18px;
        }

        .quiz-toolbar h2 {
            margin: 0;
        }

        .font-size-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .font-size-btn {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid rgba(15, 118, 110, 0.16);
            border-radius: 999px;
            background: rgba(255,255,255,0.82);
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
        }

        .font-size-btn:hover {
            background: rgba(15, 118, 110, 0.09);
        }

        ul.fill-blanks {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
            color: var(--text-main);
            font-size: 1.02em;
        }

        ul.fill-blanks li {
            position: relative;
            margin-bottom: 12px;
            line-height: 1.85;
            padding: 14px 52px 14px 16px;
            background: rgba(255,255,255,0.76);
            border: 1px solid rgba(15, 118, 110, 0.12);
            border-radius: 16px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        }
        .blank-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            margin-right: 8px;
            border-radius: 999px;
            font-weight: 900;
            color: #fff;
            background: var(--accent);
        }
        .blank-section-title {
            font-weight: 900;
            font-size: 1.03em;
            color: var(--accent);
            margin: 26px 0 12px;
            padding: 12px 14px;
            background: rgba(15, 118, 110, 0.08);
            border: 1px solid rgba(15, 118, 110, 0.14);
            border-left: 5px solid var(--accent);
            border-radius: 16px;
        }
        .blank-section-title:first-of-type {
            margin-top: 0;
        }

        .blank-input {
            border: none;
            border-bottom: 2px solid var(--accent);
            background: transparent;
            text-align: center;
            margin: 0 3px;
            color: var(--primary);
            font-size: 0.95em;
            font-weight: bold;
            padding: 0 4px 2px;
            width: 30px;
            min-width: 30px;
            outline: none;
            transition: border-color 0.2s, width 0.1s;
            box-sizing: content-box;
        }
        .blank-input:focus {
            border-bottom-color: #f97316;
        }

        .blank-input:focus {
            border-bottom-color: var(--accent);
        }

        .blank-input::placeholder {
            color: #ccc;
            font-weight: normal;
        }

        .blank-input:disabled {
            color: #7f8c8d;
            border-bottom-color: #bdc3c7;
            cursor: not-allowed;
        }

        .blank-input.attempt-locked {
            color: #8f3b28;
            background: #fff1e8 !important;
            border-bottom-color: #d66b4d !important;
        }

        .blank-input.correct {
            background: var(--correct-bg) !important;
            border-bottom-color: var(--accent) !important;
        }

        .blank-input.wrong {
            background: var(--wrong-bg) !important;
            border-bottom-color: #e74c3c !important;
        }

        .mc-question {
            position: relative;
            margin-bottom: 35px;
            background: #fafbfc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .mc-question.wrong {
            border-left: 4px solid #e74c3c;
        }

        .mc-question.correct {
            border-left: 4px solid var(--accent);
        }

        .mc-question.mc-locked-reminder {
            border-color: #efc45f;
            border-left: 4px solid #d99a21;
            background: #fffaf0;
            box-shadow: inset 0 0 0 1px rgba(239, 196, 95, 0.45);
        }

        .mc-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: var(--primary);
            overflow-wrap: anywhere;
        }

        .mc-options {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .mc-options li {
            background: var(--card-bg);
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .mc-options li:hover:not(.disabled) {
            border-left-color: var(--accent);
            background: #f0f9f4;
        }

        .mc-options li:has(input[type="radio"]:checked) {
            border-left-color: var(--accent);
            background: #e8f8f5;
            border-color: var(--accent);
            position: relative;
            padding-right: 34px;
        }

        .mc-options li:has(input[type="radio"]:checked)::after {
            content: "✦";
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 1rem;
            font-weight: 900;
            animation: mcChoiceSpark 520ms ease both;
        }

        .mc-options li.wrong {
            border-left-color: #e74c3c !important;
            background: #fff5f5 !important;
            border-color: #f5c6c6 !important;
        }

        .mc-options li.wrong label {
            color: #c0392b;
        }

        .mc-options li.correct {
            border-left-color: var(--accent) !important;
            background: #f0fff4 !important;
            border-color: #b8e6c8 !important;
        }

        .mc-options li.mc-locked-answer {
            border-left-color: #d99a21 !important;
            background: #fff8df !important;
            border-color: #efc45f !important;
        }

        .mc-options label {
            display: flex;
            align-items: flex-start;
            padding: 12px 18px;
            cursor: pointer;
            width: 100%;
        }

        .mc-options label > span {
            flex: 1 1 auto;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .mc-options input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .mc-options input[type="radio"]:disabled {
            cursor: not-allowed;
        }

        .mc-options label:has(input[type="radio"]:disabled) {
            cursor: not-allowed;
            color: #7f8c8d;
        }

        .option-label {
            font-weight: bold;
            margin-right: 8px;
            color: var(--accent);
        }

        @keyframes mcChoiceSpark {
            0% { opacity: 0; transform: translateY(-50%) scale(0.35) rotate(-18deg); }
            55% { opacity: 1; transform: translateY(-50%) scale(1.3) rotate(10deg); }
            100% { opacity: 0.95; transform: translateY(-50%) scale(1) rotate(0); }
        }

        .matching-section {
            margin-bottom: 35px;
            background: #fafbfc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .matching-instruction {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .matching-table {
            width: 100%;
            border-collapse: collapse;
        }

        .matching-table th {
            text-align: left;
            padding: 10px 15px;
            background: #f8f9fa;
            color: var(--primary);
            border: 1px solid var(--border-color);
            font-weight: bold;
        }

        .matching-table td {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .matching-table tr:nth-child(even) td {
            background: #fcfcfc;
        }

        .matching-table select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95em;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            min-width: 80px;
        }

        .matching-table select:focus {
            border-color: var(--accent);
        }

        .matching-table select:disabled {
            cursor: not-allowed;
            background: #f1f1f1;
        }

        .matching-table select.correct {
            border-color: var(--accent);
            background: var(--correct-bg);
        }

        .matching-table select.wrong {
            border-color: #e74c3c;
            background: var(--wrong-bg);
        }

        .right-label {
            font-weight: bold;
            color: var(--text-light);
            margin-right: 6px;
        }

        .submit-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 50px auto 30px;
            padding: 16px 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #1e8449;
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 4px rgba(39, 174, 96, 0.2);
        }

        .submit-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #score-display {
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        #score-display.show {
            display: block;
        }

        #score-display.perfect {
            background: var(--correct-bg);
            color: #1e7e34;
            border: 1px solid #b8e6c8;
        }

        #score-display.partial {
            background: #fff8e1;
            color: #b9770e;
            border: 1px solid #f5cba7;
        }

        #score-display.zero {
            background: var(--wrong-bg);
            color: #c0392b;
            border: 1px solid #f5c6c6;
        }

        .feedback-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .answer-toggle-btn,
        .argue-btn {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            padding: 0;
            font-size: 0.88rem;
            font-weight: 1000;
            line-height: 1;
            cursor: pointer;
        }

        .answer-toggle-btn {
            border: 1px solid rgba(15, 118, 110, 0.22);
            border-radius: 999px;
            background: #e6f7f4;
            color: #0f766e;
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.12);
        }

        .answer-toggle-btn:hover {
            background: #d3f1ec;
            color: #0b5f59;
        }

        .answer-toggle-btn.active {
            border-color: rgba(15, 118, 110, 0.42);
            background: var(--accent);
            color: #fff;
        }

        .argue-btn {
            border: 1px solid #e2c8b0;
            background: #fff6ed;
            color: #9a5a2a;
            box-shadow: 0 8px 18px rgba(122, 67, 26, 0.12);
        }

        .argue-btn:hover {
            background: #fde8d0;
            color: #7a431a;
        }

        .argue-btn.dispute-pending {
            border-color: #d89528;
            background: #fff8e5;
            color: #7a5528;
        }

        .argue-btn.dispute-approved {
            border-color: #8cc8a8;
            background: #ecf9f1;
            color: #237a52;
        }

        .argue-btn.dispute-rejected {
            border-color: #efc9c3;
            background: #fff0ed;
            color: #b54747;
        }

        .argue-modal {
            position: fixed;
            inset: 0;
            z-index: 1300;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(13, 44, 39, 0.38);
            backdrop-filter: blur(6px);
        }

        .argue-modal-card {
            position: relative;
            overflow: hidden;
            width: min(460px, 100%);
            min-height: 252px;
            padding: 22px;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 80px rgba(17, 54, 48, 0.22);
        }

        .argue-modal-card h2 {
            margin: 0 0 7px;
            color: var(--ink);
            font-size: 1.25rem;
        }

        .argue-modal-card p {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.45;
        }

        .argue-modal-card textarea {
            width: 100%;
            min-height: 92px;
            padding: 10px 12px;
            border: 1px solid #dce8e3;
            border-radius: 12px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }

        .argue-modal-status {
            margin: 0 0 12px !important;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f6faf8;
            font-size: 0.88rem;
        }

        .argue-modal-status.pending { color: #7a5528; background: #fff8e5; }
        .argue-modal-status.approved { color: #237a52; background: #ecf9f1; }
        .argue-modal-status.rejected { color: #b54747; background: #fff0ed; }
        .argue-content {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 12px;
        }
        .argue-modal-card.sent {
            animation: argueSentPop 740ms cubic-bezier(.2,.82,.2,1) both;
        }
        .argue-modal-card.sent::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;
            background: linear-gradient(135deg, rgba(228, 246, 236, 0.98), rgba(255, 247, 233, 0.96));
            animation: argueSentWash 820ms cubic-bezier(.2,.82,.2,1) forwards;
        }
        .argue-modal-card.sent .argue-content {
            animation: argueContentOut 620ms ease forwards;
        }
        .argue-modal-status.sent {
            color: #13766d;
            background: linear-gradient(135deg, #ecf9f1, #fffaf0);
        }
        .argue-sent-message {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 28px;
            text-align: center;
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            pointer-events: none;
        }

        .result-card {

            position: absolute;

            pointer-events: none;

                radial-gradient(circle at 72% 18%, rgba(255, 181, 30, .35), transparent 18%);

        .result-stamp {
            position: absolute;
            z-index: 7;
            right: -18px;
            top: -22px;
            display: grid;
            place-items: center;
            width: 210px;
            height: 82px;
            border: 5px solid currentColor;
            border-radius: 16px;
            pointer-events: none;
            font-size: 31px;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: .04em;
            mix-blend-mode: multiply;
            opacity: 0;
            transform: rotate(9deg) scale(1.35);
            filter: contrast(1.08) blur(1px);

        .result-stamp::before {
            content: "";

            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 18% 24%, rgba(255,255,255,.42) 0 2px, transparent 3px),
                radial-gradient(circle at 76% 32%, rgba(255,255,255,.34) 0 1px, transparent 2px),

                repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,.13) 8px 9px);
            opacity: .72;
            mix-blend-mode: screen;
        }

        .result-stamp::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 2px solid currentColor;
            border-radius: inherit;
            opacity: .72;
        }

    ];

    var students = [
        { id: 'EI6688', label: '甘昕雨Eilene' },
        { id: 'EV3389', label: '刘榆雯Eva' },
        { id: 'LEO6666', label: 'jxbleo' }
    ];

    var validIds = ['EI6688', 'EV3389', 'LEO6666'];

    function getStudentLabel(id) {
        for (var i = 0; i < students.length; i++) {
            if (students[i].id === id) return students[i].label;
        }
        return id;
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getStoredIdentity() {
        return localStorage.getItem('opencode_user') || (localStorage.getItem('opencode_visitor') === 'true' ? 'VISITOR' : '');
    }

    function updateIdentityStatus() {
        var el = document.getElementById('identity-status');
        if (!el) return;
        var id = studentId || getStoredIdentity();
        el.textContent = id ? (id === 'VISITOR' ? 'Visitor' : getStudentLabel(id)) : 'Login';
    }

    function getParams() {
        var q = window.location.search.substring(1);
        var p = q.split('&');
        var params = {};
        for (var i = 0; i < p.length; i++) {
            var kv = p[i].split('=');
            if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv.slice(1).join('=') || '');
        }
        return params;
    }

    function logEvent(eventType, eventData) {
        var entry = {
            studentId: studentId,
            taskId: setId,
            eventType: eventType,
            timestamp: new Date().toISOString(),
            eventData: eventData || null
        };
        console.log(JSON.stringify(entry));
    }

    function formatAudioTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) seconds = 0;
        var min = Math.floor(seconds / 60);
        var sec = Math.floor(seconds % 60);
        return min + ':' + String(sec).padStart(2, '0');
    }

    function getAudio() {
        return document.getElementById('bbc-audio');
    }

    function markAudioStartedAt() {
        if (!audioStartedAt) audioStartedAt = new Date().toISOString();
    }

    function audioToSubmitSeconds() {
        if (!audioStartedAt) return null;
        return Math.max(0, Math.round((Date.now() - new Date(audioStartedAt).getTime()) / 1000));
    }

    function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value;
    }

    function setProgress(id, pct) {
        var el = document.getElementById(id);
        if (el) el.style.width = pct + '%';
    }

    function updateAudioUi() {
        var audio = getAudio();
        if (!audio) return;
        var duration = audio.duration || 0;
        var current = audio.currentTime || 0;
        var pct = duration ? Math.min(100, Math.max(0, current / duration * 100)) : 0;
        var playText = audio.paused ? '▶' : 'Ⅱ';
        setText('sticky-play-btn', playText);
        setText('sticky-current-time', formatAudioTime(current));
        setText('sticky-duration', formatAudioTime(duration));
        if (!isDragging) setProgress('sticky-progress-fill', pct);
    }

    function toggleAudioPlayback() {
        var audio = getAudio();
        if (!audio) return;
        if (audio.paused) {
            var playPromise = audio.play();
            if (playPromise && playPromise.catch) {
                if (playPromise.then) {
                    playPromise.then(markAudioStartedAt).catch(function() {});
                }
                playPromise.catch(function() {
                    updateAudioUi();
                });
            } else {
                markAudioStartedAt();
            }
        } else {
            audio.pause();
        }
        updateAudioUi();
    }

    function backFiveSeconds() {
        var audio = getAudio();
        if (!audio) return;
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - 5);
        updateAudioUi();
    }

    function isDesktopAudioShortcut() {
        return !window.matchMedia || window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    }

    function shouldIgnoreAudioSpaceShortcut(target) {
        if (document.querySelector('.modal.show, .argue-modal')) return true;
        if (!target || target === document.body || target === document.documentElement) return false;
        if (target.closest('input, textarea, select, button, [contenteditable="true"]')) return true;
        return false;
    }

    function handleAudioSpaceShortcut(event) {
        if (event.code !== 'Space' && event.key !== ' ') return;
        if (event.repeat || !isDesktopAudioShortcut()) return;
        if (shouldIgnoreAudioSpaceShortcut(event.target)) return;
        event.preventDefault();
        toggleAudioPlayback();
    }

    function setupAudioPlayer() {
        var audio = getAudio();
        if (!audio) return;
        if (audio.dataset.ready !== 'true') {
            audio.dataset.ready = 'true';
            var playButtons = [document.getElementById('sticky-play-btn')];
            var backButtons = [document.getElementById('sticky-back-btn')];
            for (var i = 0; i < playButtons.length; i++) {
                if (playButtons[i]) playButtons[i].addEventListener('click', toggleAudioPlayback);
            }
            for (var j = 0; j < backButtons.length; j++) {
                if (backButtons[j]) backButtons[j].addEventListener('click', backFiveSeconds);
            }
            audio.addEventListener('loadedmetadata', updateAudioUi);
            audio.addEventListener('timeupdate', updateAudioUi);
            audio.addEventListener('play', function() {
                markAudioStartedAt();
                updateAudioUi();
            });
            audio.addEventListener('pause', updateAudioUi);
            audio.addEventListener('ended', updateAudioUi);

            var progressWrap = document.getElementById('sticky-player').querySelector('.progress-wrap');
            var progressFill = document.getElementById('sticky-progress-fill');

            function seekFromEvent(clientX) {
                var rect = progressWrap.getBoundingClientRect();
                var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                if (progressFill) progressFill.style.width = (pct * 100) + '%';
                if (audio.duration) audio.currentTime = pct * audio.duration;
                if (!audio.paused) {
                    var playPromise = audio.play();
                    if (playPromise && playPromise.catch) playPromise.catch(function() {});
                }
            }

            function onPointerDown(e) {
                isDragging = true;
                seekFromEvent(e.clientX);
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                seekFromEvent(e.clientX);
                e.preventDefault();
            }

            function onPointerUp() {
                isDragging = false;
            }

            if (progressWrap) {
                progressWrap.addEventListener('mousedown', onPointerDown);
                progressWrap.addEventListener('touchstart', function(e) {
                    onPointerDown(e.touches[0]);
                }, { passive: false });
            }
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchmove', function(e) {
                if (isDragging) {
                    onPointerMove(e.touches[0]);
                    e.preventDefault();
                }
            }, { passive: false });
            document.addEventListener('touchend', onPointerUp);
            document.addEventListener('keydown', handleAudioSpaceShortcut);
        }
        updateAudioUi();
    }

    function updateQuizFontSize(delta) {
        quizFontScale = Math.min(1.3, Math.max(0.9, quizFontScale + delta));
        var form = document.getElementById('quiz-form');
        if (form) form.style.fontSize = quizFontScale.toFixed(2) + 'em';
    }

    function showIncompleteModal(missingCount) {
        var modal = document.getElementById('incomplete-modal');
        var message = document.getElementById('incomplete-message');
        if (message) {
            message.textContent = 'Please answer all questions before submitting. ' + missingCount + ' question' + (missingCount === 1 ? ' is' : 's are') + ' still waiting for you.';
        }
        if (modal) modal.classList.add('show');
    }

    function renderBlanks(blanks) {
        var container = document.getElementById('blanks-container');
        if (!blanks || !blanks.length) {
            container.innerHTML = '<li>No fill-in-the-blank exercises available.</li>';
            return;
        }
        blankCount = blanks.length;
        var html = '';
        var currentSection = '';
        for (var i = 0; i < blanks.length; i++) {
            var b = blanks[i];
            var num = b.number || (i + 1);
            if (b.section && b.section !== currentSection) {
                currentSection = b.section;
                html += '<div class="blank-section-title">' + currentSection + '</div>';
            }
            var sentence = b.sentence;
            var inputHtml = ' <input type="text" name="' + b.id + '" class="blank-input" placeholder="' + num + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
            sentence = sentence.replace('_____', inputHtml);
            html += '<li><span class="blank-num">' + num + '</span>' + sentence + '</li>';
        }
        container.innerHTML = html;

        var inputs = container.querySelectorAll('.blank-input');
        for (var j = 0; j < inputs.length; j++) {
            inputs[j].addEventListener('input', function() {
                var len = this.value.length || this.placeholder.length;
                this.style.width = Math.max(30, len * 8 + 10) + 'px';
            });
        }
    }

    function renderMC(mcItems) {
        var container = document.getElementById('mc-container');
        if (!mcItems || !mcItems.length) {
            container.innerHTML = '<p>No multiple choice questions available.</p>';
            mcCount = 0;
            return;
        }
        mcCount = mcItems.length;
        var labels = ['A', 'B', 'C', 'D'];
        var html = '';
        for (var i = 0; i < mcItems.length; i++) {
            var m = mcItems[i];
            var qNum = m.number || (i + 1);
            html += '<div class="mc-question" data-id="' + m.id + '">';
            html += '<div class="mc-title">' + qNum + '. ' + m.question + '</div>';
            html += '<ul class="mc-options">';
            for (var o = 0; o < m.options.length; o++) {
                var opt = m.options[o];
                var letter = labels[o] || '';
                var displayOpt = opt;
                if (displayOpt.indexOf(letter + '. ') !== 0) {
                    displayOpt = letter + '. ' + displayOpt;
                }
                html += '<li>';
                html += '<label>';
                html += '<input type="radio" name="' + m.id + '" value="' + letter + '">';
                html += '<span><span class="option-label">' + letter + '.</span> ' + displayOpt.substring(letter.length + 2) + '</span>';
                html += '</label>';
                html += '</li>';
            }
            html += '</ul></div>';
        }
        container.innerHTML = html;
    }

    function renderMatching(matching) {
        var divider = document.getElementById('matching-divider');
        var heading = document.getElementById('matching-heading');
        var container = document.getElementById('matching-container');

        if (!matching || !matching.length) {
            divider.style.display = 'none';
            heading.style.display = 'none';
            matchCount = 0;
            return;
        }
        divider.style.display = '';
        heading.style.display = '';
        matchCount = matching.length;

        var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

        var html = '';
        for (var i = 0; i < matching.length; i++) {
            var m = matching[i];
            var pairs = m.pairs;
            html += '<div class="matching-section" data-id="' + m.id + '">';
            html += '<div class="matching-instruction">' + (i + 1) + '. ' + m.instruction + '</div>';
            html += '<table class="matching-table">';
            html += '<thead><tr><th>Item</th><th>Your Match</th></tr></thead>';
            html += '<tbody>';

            var rightItems = [];
            for (var p = 0; p < pairs.length; p++) {
                rightItems.push(pairs[p].right);
            }

            for (var r = 0; r < pairs.length; r++) {
                var pair = pairs[r];
                html += '<tr>';
                html += '<td>' + pair.left + '</td>';
                html += '<td>';
                html += '<select name="' + m.id + '-' + r + '">';
                html += '<option value="">-- Select --</option>';
                for (var o = 0; o < rightItems.length; o++) {
                    html += '<option value="' + labels[o] + '">' + labels[o] + '. ' + rightItems[o] + '</option>';
                }
                html += '</select>';
                html += '</td>';
                html += '</tr>';
            }

            html += '</tbody></table></div>';
        }
        container.innerHTML = html;
    }

    function formatEpisodeDate(setId) {
        var match = String(setId || '').match(/BBC-(\d{2})(\d{2})(\d{2})/);
        if (!match) return '';
        return '20' + match[1] + '-' + match[2] + '-' + match[3];
    }

    function lessonRenderTheme(data) {
        return String(data && (data.renderTheme || data.theme) || '').trim();
    }

    function applyRenderTheme(theme) {
        var classes = document.body.className.split(/\s+/).filter(function(name) {
            return name && name.indexOf('bbc-theme-') !== 0;
        });
        if (theme) classes.push('bbc-theme-' + theme.replace(/[^a-z0-9-]/gi, '-').toLowerCase());
        document.body.className = classes.join(' ');
    }

    function renderHeroTitle(data, theme) {
        var titleEl = document.getElementById('title-area');
        var date = formatEpisodeDate(setId || data.id);
        if (theme === 'blue-studio') {
            titleEl.innerHTML =
                '<div class="hero-kicker"><span>BBC 6 Minute English</span>' +
                (date ? '<span class="hero-kicker-date">' + escapeHtml(date) + '</span>' : '') +
                '</div>' +
                '<h1 data-lesson-title>' + escapeHtml(data.title) + '</h1>';
            document.getElementById('hero-meta').innerHTML = '';
            return;
        }
        titleEl.innerHTML = '<h1 data-lesson-title>' + escapeHtml(data.title) + '</h1>' +
            '<div class="hero-subtitle">BBC Six Minute English, ' + escapeHtml(date) + '</div>';
        document.getElementById('hero-meta').innerHTML = '';
    }

    function renderHeroTools(theme) {
        var tools = document.getElementById('hero-tools');
        if (!tools) return;
        if (theme !== 'blue-studio') {
            tools.innerHTML = '';
            return;
        }
        tools.innerHTML =
            '<button class="hero-tool-btn" type="button" id="lesson-worksheet-btn">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">' +
                    '<path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>' +
                '</svg>Worksheet</button>';
        document.getElementById('lesson-worksheet-btn').addEventListener('click', function() {
            window.print();
        });
    }

    function renderLessonWords(words, message) {
        var content = document.getElementById('lesson-words-content');
        if (!content) return;
        if (message) {
            content.className = 'lesson-words-empty';
            content.textContent = message;
            return;
        }
        if (!words || !words.length) {
            content.className = 'lesson-words-empty';
            content.textContent = 'No saved words from this lesson yet. Select a word or short phrase in the exercise and add it to My Words.';
            return;
        }
        content.className = '';
        content.innerHTML = words.map(function(word) {
            return '<article class="lesson-word-item">' +
                '<strong>' + escapeHtml(word.text || '') + '</strong>' +
                '<span>' + escapeHtml(word.context || word.source_title || 'Saved from this lesson') + '</span>' +
            '</article>';
        }).join('');
    }

    function loadLessonWords() {
        if (studentId === 'VISITOR') {
            renderLessonWords([], 'Log in as a student to see saved words for this lesson.');
            return;
        }
        if (!window.MrCatCloud || typeof window.MrCatCloud.callFunction !== 'function') {
            renderLessonWords([], 'My Words is not available on this page yet.');
            return;
        }
        renderLessonWords([], 'Loading words from this lesson...');
        window.MrCatCloud.callFunction('studentVocabulary', {
            action: 'list',
            limit: 200
        }).then(function(result) {
            if (!result || !result.success) throw new Error(result && result.message || 'Unable to load My Words.');
            var words = (result.words || []).filter(function(word) {
                return String(word.source_set_id || '') === String(setId || '');
            });
            renderLessonWords(words);
        }).catch(function(error) {
            renderLessonWords([], error.message || 'Unable to load My Words.');
        });
    }

    function openLessonWordsPanel() {
        var panel = document.getElementById('lesson-words-panel');
        if (!panel) return;
        panel.classList.add('open');
        loadLessonWords();
    }

    function setupLessonWordsPanel() {
        if (lessonWordsListenersReady) return;
        lessonWordsListenersReady = true;
        var close = document.getElementById('lesson-words-close');
        if (close) {
            close.addEventListener('click', function() {
                document.getElementById('lesson-words-panel').classList.remove('open');
            });
        }
        window.addEventListener('mrcat:vocab-saved', function(event) {
            var panel = document.getElementById('lesson-words-panel');
            if (!panel || !panel.classList.contains('open')) return;
            loadLessonWords();
        });
    }

    function renderLesson(data) {
        lessonData = data;
        var theme = lessonRenderTheme(data);
        applyRenderTheme(theme);
        setupLessonWordsPanel();
        renderHeroTitle(data, theme);
        renderHeroTools(theme);

        var audioSrc = document.getElementById('audio-source');
        audioSrc.src = data.audioSrc;
        var audio = document.getElementById('bbc-audio');
        audio.load();
        setupAudioPlayer();

        renderBlanks(data.blanks);
        renderMC(data.multipleChoice);
        renderMatching(data.matching);

        document.getElementById('content').style.display = 'block';
        document.getElementById('loading-message').style.display = 'none';
        if (teacherMode) {
            renderTeacherAnswerToolbar();
        } else {
            loadBlankAttemptState();
            loadMcLockState();
            restoreSavedOrPrefillAnswers();
            applyBlankAttemptLocks();
            applyMcLocks();
            renderHistoryToolbar();
            loadHistoryContextFromDashboard().then(renderEligibleHistoryReview);
            if (focusQuestionId) {
                var historyPromise = historyAttemptId
                    ? renderEligibleHistoryReview()
                    : loadHistoryContextFromDashboard().then(function() {
                        return historyAttemptId ? renderEligibleHistoryReview() : null;
                    });
                historyPromise.then(function() {
                    window.setTimeout(function() { jumpToQuestion(focusQuestionId); }, 120);
                });
            }
        }
    }

    function showError(msg) {
        document.getElementById('loading-message').style.display = 'none';
        var errEl = document.getElementById('error-message');
        document.getElementById('error-text').textContent = msg;
        errEl.style.display = 'block';
    }

    function showLoginPrompt() {
        document.getElementById('loading-message').style.display = 'none';
        var modal = document.getElementById('login-modal');
        var customInput = document.getElementById('bbc-custom-id-input');
        var customBtn = document.getElementById('bbc-custom-login-btn');
        var errorEl = document.getElementById('bbc-login-error');
        var visitorBtn = document.getElementById('bbc-visitor-btn');
        var savedBtn = document.getElementById('bbc-saved-identity-btn');
        if (customInput) customInput.value = '';
        if (errorEl) errorEl.textContent = '';
        var stored = localStorage.getItem('opencode_user') || '';
        if (savedBtn && stored) {
            savedBtn.style.display = 'block';
            savedBtn.textContent = 'Continue as ' + getStudentLabel(stored);
            savedBtn.onclick = function() { selectStudent(stored); };
        } else if (savedBtn) {
            savedBtn.style.display = 'none';
        }

        function handleCustomLogin() {
            var id = customInput.value.trim();
            if (!id) { errorEl.textContent = 'Please enter a student ID.'; return; }
            if (validIds.indexOf(id) !== -1) {
                errorEl.textContent = '';
                selectStudent(id);
            } else {
                errorEl.textContent = 'Unknown ID: "' + id + '"';
                if (confirm('No matching ID for "' + id + '". Continue as visitor?')) {
                    selectVisitor();
                }
            }
        }

        function selectVisitor() {
            studentId = 'VISITOR';
            localStorage.removeItem('opencode_user');
            localStorage.setItem('opencode_visitor', 'true');
            updateIdentityStatus();
            logEvent('login', { studentId: 'VISITOR' });
            modal.classList.remove('show');
            fetchLesson();
        }

        if (customBtn) customBtn.addEventListener('click', handleCustomLogin);
        if (customInput) customInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleCustomLogin();
        });
        if (visitorBtn) visitorBtn.addEventListener('click', selectVisitor);

        modal.classList.add('show');
    }

    function selectStudent(id) {
        studentId = id;
        localStorage.setItem('opencode_user', id);
        localStorage.removeItem('opencode_visitor');
        updateIdentityStatus();
        var url = new URL(window.location.href);
        url.searchParams.set('user', studentId);
        window.history.replaceState({}, '', url);
        logEvent('login', { studentId: studentId });
        document.getElementById('login-modal').classList.remove('show');
        fetchLesson();
    }

    function init() {
        var params = getParams();
        setId = params.set || '';
        assignmentId = params.assignment || '';
        prefillAttemptId = params.prefill || '';
        historyAttemptId = params.history || prefillAttemptId;
        historyBestPercentage = params.history_score === undefined ? null : Number(params.history_score);
        if (isNaN(historyBestPercentage)) historyBestPercentage = null;
        focusQuestionId = params.focus || '';
        assignmentStatus = params.status || '';
        historyFeedbackEligible = assignmentStatus === 'passed' || assignmentStatus === 'mastered';
        teacherMode = params.teacher === '1';
        studentId = params.user || getStoredIdentity();
        if (params.user && params.user !== 'VISITOR') {
            localStorage.setItem('opencode_user', params.user);
            localStorage.removeItem('opencode_visitor');
        } else if (params.user === 'VISITOR') {
            localStorage.removeItem('opencode_user');
            localStorage.setItem('opencode_visitor', 'true');
        }
        updateIdentityStatus();

        logEvent('page_enter', { set: setId, user: studentId });

        if (!setId) {
            showError('No lesson set specified. Please add a <code>?set=BBC-XXXXXX</code> parameter to the URL.');
            return;
        }

        if (teacherMode) {
            studentId = 'TEACHER';
            fetchLesson();
            return;
        }

        if (!studentId || studentId === 'VISITOR') {
            if (studentId === 'VISITOR') {
                fetchLesson();
                return;
            }
            showLoginPrompt();
            return;
        }

        fetchLesson();
    }

    function fetchLesson() {
        var url = 'data/' + setId + '.json?_=' + Date.now();
        fetch(url)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Failed to load lesson data (HTTP ' + response.status + '). Please check that the set ID "' + setId + '" is correct.');
                }
                return response.json();
            })
            .then(function(data) {
                renderLesson(data);
            })
            .catch(function(err) {
                showError(err.message || 'An error occurred while loading the lesson.');
            });
    }

    function collectAnswers() {
        var answers = {};
        var form = document.getElementById('quiz-form');
        var els = form.elements;
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            if (el.type === 'radio') {
                if (el.checked) answers[el.name] = el.value;
            } else if (el.type === 'text') {
                answers[el.name] = el.value.trim();
            } else if (el.tagName === 'SELECT') {
                answers[el.name] = el.value;
            }
        }
        return answers;
    }

    function answerStorageKey() {
        return 'bbc-answers-' + setId + '-' + (assignmentId || studentId || 'visitor');
    }

    function blankAttemptStorageKey() {
        return 'bbc-blank-attempts-' + setId + '-' + (assignmentId || studentId || 'visitor');
    }

    function mcLockStorageKey() {
        return 'bbc-mc-locks-' + setId + '-' + (assignmentId || studentId || 'visitor');
    }

    function isMcQuestionId(questionId) {
        return /^mc-/i.test(String(questionId || ''));
    }

    function loadMcLockState() {
        if (!setId || !studentId || studentId === 'VISITOR' || teacherMode) {
            mcLockedAnswers = {};
            return;
        }
        try {
            mcLockedAnswers = JSON.parse(localStorage.getItem(mcLockStorageKey()) || '{}') || {};
        } catch (e) {
            mcLockedAnswers = {};
        }
    }

    function saveMcLockState() {
        if (!setId || !studentId || studentId === 'VISITOR' || teacherMode) return;
        try { localStorage.setItem(mcLockStorageKey(), JSON.stringify(mcLockedAnswers)); } catch (e) {}
    }

    function applyMcLocks() {
        document.querySelectorAll('.mc-question.mc-locked-reminder').forEach(function(el) {
            el.classList.remove('mc-locked-reminder');
        });
        document.querySelectorAll('.mc-options li.mc-locked-answer').forEach(function(el) {
            el.classList.remove('mc-locked-answer');
        });
        document.querySelectorAll('.mc-question[data-mc-locked="1"]').forEach(function(mcDiv) {
            mcDiv.removeAttribute('data-mc-locked');
            mcDiv.querySelectorAll('input[type="radio"]').forEach(function(input) {
                input.removeAttribute('title');
            });
            mcDiv.querySelectorAll('.mc-options li.disabled').forEach(function(li) {
                li.classList.remove('disabled');
            });
        });
        Object.keys(mcLockedAnswers || {}).forEach(function(questionId) {
            var value = mcLockedAnswers[questionId];
            var mcDiv = document.querySelector('[data-id="' + CSS.escape(questionId) + '"]');
            if (!mcDiv) return;
            mcDiv.setAttribute('data-mc-locked', '1');
            mcDiv.classList.add('mc-locked-reminder');
            var lockedRadio = mcDiv.querySelector('input[value="' + CSS.escape(String(value)) + '"]');
            if (lockedRadio) lockedRadio.checked = true;
            mcDiv.querySelectorAll('input[type="radio"]').forEach(function(input) {
                input.disabled = true;
                input.title = 'This multiple-choice answer is locked after submission.';
            });
            mcDiv.querySelectorAll('.mc-options li').forEach(function(li) {
                li.classList.add('disabled');
            });
            var lockedLi = lockedRadio && lockedRadio.closest('li');
            if (lockedLi) lockedLi.classList.add('mc-locked-answer');
        });
    }

    function rememberMcLocksFromAnswers(answers) {
        var changed = false;
        if (!answers || !lessonData || !Array.isArray(lessonData.multipleChoice)) {
            applyMcLocks();
            return;
        }
        lessonData.multipleChoice.forEach(function(item) {
            var questionId = item && item.id;
            if (!isMcQuestionId(questionId)) return;
            var value = answers[questionId];
            if (value == null || String(value) === '') return;
            if (mcLockedAnswers[questionId] === value) return;
            mcLockedAnswers[questionId] = value;
            changed = true;
        });
        if (changed) saveMcLockState();
        applyMcLocks();
    }

    function rememberMcLocks(results) {
        var changed = false;
        if (!Array.isArray(results)) {
            applyMcLocks();
            return;
        }
        (results || []).forEach(function(result) {
            if (!result || result.type !== 'mc') return;
            var questionId = result.id;
            if (!isMcQuestionId(questionId)) return;
            if (result.userAnswer == null || String(result.userAnswer) === '') return;
            if (mcLockedAnswers[questionId] === result.userAnswer) return;
            mcLockedAnswers[questionId] = result.userAnswer;
            changed = true;
        });
        if (changed) saveMcLockState();
        applyMcLocks();
    }

    function blankAttemptLocksEnabled() {
        return Number(blankAttemptLimit || 0) > 0;
    }

    function loadBlankAttemptState() {
        if (!blankAttemptLocksEnabled() || !setId || !studentId || studentId === 'VISITOR' || teacherMode) {
            blankAttemptState = {};
            try { localStorage.removeItem(blankAttemptStorageKey()); } catch (e) {}
            return;
        }
        try {
            blankAttemptState = JSON.parse(localStorage.getItem(blankAttemptStorageKey()) || '{}') || {};
        } catch (e) {
            blankAttemptState = {};
        }
    }

    function saveBlankAttemptState() {
        if (!blankAttemptLocksEnabled()) {
            try { localStorage.removeItem(blankAttemptStorageKey()); } catch (e) {}
            return;
        }
        if (!setId || !studentId || studentId === 'VISITOR' || teacherMode) return;
        try { localStorage.setItem(blankAttemptStorageKey(), JSON.stringify(blankAttemptState)); } catch (e) {}
    }

    function blankAttemptEntry(questionId) {
        if (!blankAttemptState[questionId]) {
            blankAttemptState[questionId] = { attempts: 0, locked: false, value: '' };
        }
        return blankAttemptState[questionId];
    }

    function updateBlankLockUi(input, entry) {
        if (!input || !entry) return;
        if (!blankAttemptLocksEnabled()) {
            input.classList.remove('attempt-locked');
            input.disabled = submitted === true;
            input.removeAttribute('title');
            return;
        }
        input.classList.toggle('attempt-locked', entry.locked === true);
        input.disabled = entry.locked === true || submitted === true;
        if (entry.locked) {
            input.title = 'Three tries used. This answer is locked.';
        } else if (entry.attempts > 0) {
            input.title = (blankAttemptLimit - entry.attempts) + ' tries left for this blank.';
        } else {
            input.removeAttribute('title');
        }
    }

    function applyBlankAttemptLocks() {
        if (!blankAttemptLocksEnabled()) {
            document.querySelectorAll('.blank-input.attempt-locked').forEach(function(input) {
                input.classList.remove('attempt-locked');
                input.removeAttribute('title');
                input.disabled = submitted === true;
            });
            return;
        }
        Object.keys(blankAttemptState || {}).forEach(function(questionId) {
            var entry = blankAttemptState[questionId];
            var input = document.querySelector('[name="' + CSS.escape(questionId) + '"].blank-input');
            if (!input || !entry) return;
            if (entry.locked) {
                input.value = entry.value || input.value;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            updateBlankLockUi(input, entry);
        });
    }

    function recordBlankAttemptResults(results) {
        if (!blankAttemptLocksEnabled() || teacherMode || !results || !results.length) return;
        var changed = false;
        results.forEach(function(result) {
            if (result.type !== 'blank') return;
            var input = document.querySelector('[name="' + CSS.escape(result.id) + '"].blank-input');
            if (!input) return;
            if (result.isCorrect) {
                if (blankAttemptState[result.id]) {
                    delete blankAttemptState[result.id];
                    changed = true;
                }
                input.classList.remove('attempt-locked');
                input.removeAttribute('title');
                return;
            }
            var entry = blankAttemptEntry(result.id);
            if (!entry.locked) {
                entry.attempts = Math.min(blankAttemptLimit, Number(entry.attempts || 0) + 1);
                entry.value = input.value.trim();
                entry.locked = entry.attempts >= blankAttemptLimit;
                changed = true;
            }
            updateBlankLockUi(input, entry);
        });
        if (changed) saveBlankAttemptState();
    }

    function applyAnswers(answers) {
        if (!answers) return;
        Object.keys(answers).forEach(function(name) {
            var value = answers[name];
            var fields = document.querySelectorAll('[name="' + CSS.escape(name) + '"]');
            fields.forEach(function(el) {
                if (el.type === 'radio') {
                    el.checked = el.value === value;
                } else if (el.tagName === 'SELECT') {
                    el.value = value;
                } else if (el.type === 'text') {
                    el.value = value;
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
        });
    }

    function captureViewport() {
        return {
            x: window.pageXOffset || document.documentElement.scrollLeft || 0,
            y: window.pageYOffset || document.documentElement.scrollTop || 0
        };
    }

    function restoreViewport(snapshot) {
        if (!snapshot) return;
        var restore = function() {
            window.scrollTo(snapshot.x, snapshot.y);
        };
        restore();
        window.setTimeout(restore, 0);
        window.setTimeout(restore, 80);
        window.requestAnimationFrame(function() {
            restore();
            window.requestAnimationFrame(restore);
        });
    }

    function preserveViewport(action) {
        var snapshot = captureViewport();
        var result = action();
        restoreViewport(snapshot);
        return result;
    }

    function saveDraftAnswers() {

    function restoreSavedOrPrefillAnswers() {
        if (getParams().retry === '1') {
            try { localStorage.removeItem(answerStorageKey()); } catch (e) {}
            return;
        }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(answerStorageKey()) || 'null'); } catch (e) {}
        if (saved && Object.keys(saved).length) {
            applyAnswers(saved);
            applyBlankAttemptLocks();
            if (historyAttemptId || prefillAttemptId) rememberMcLocksFromAnswers(saved);
            applyMcLocks();
            return;
        }
        if (!prefillAttemptId || !window.MrCatCloud) return;
        window.MrCatCloud.callFunction('getDashboard', {
            action: 'getAttemptForRetry',
            attempt_id: prefillAttemptId
        }).then(function(result) {
            if (result && result.success && result.attempt && result.attempt.answers) {
                applyAnswers(result.attempt.answers);
                applyBlankAttemptLocks();
                rememberMcLocksFromAnswers(result.attempt.answers);
                applyMcLocks();
                saveDraftAnswers();
            }
        }).catch(function() {});
    }

    function disputeForQuestion(disputes, questionId) {
        return (disputes || []).find(function(item) {
            return String(item.question_id) === String(questionId);
        }) || null;
    }

    function correctAnswerLine(label, value) {
        return '<strong>' + escapeHtml(label || 'Correct answer') + ':</strong> ' +
            escapeHtml(answerText(value)) +
            '<span class="correct-answer-check" aria-hidden="true">&#10003;</span>';

    function appendHistoryExplainButton(containerEl, actions, item) {
        if (!item || !item.feedback_available) return;
        var detail = document.createElement('div');
        detail.className = 'inline-explanation ' + (item.correct ? 'correct' : 'wrong');
        detail.innerHTML = correctAnswerLine('Correct answer', item.correct_answer) +
            (item.explanation ? '<br><strong>Evidence:</strong> ' + escapeHtml(item.explanation) : '');

        addQuestionExplainButton(item.question_id, containerEl, detail, 'Explain this answer', false);
        (actions && actions.parentNode ? actions.parentNode : containerEl).appendChild(detail);
    }

    function historyReviewActionsAllowed(review, item) {
        return Boolean((review && review.feedback_available) || (item && item.feedback_available));
    }

    function historyReviewTarget(item) {
        var qid = item.question_id;
        var mcDiv = document.querySelector('[data-id="' + CSS.escape(qid) + '"]');
        if (mcDiv && mcDiv.classList.contains('mc-question')) {
            var selectedLi = null;
            if (item.submitted_answer != null && String(item.submitted_answer) !== '') {
                var selectedRadio = mcDiv.querySelector('input[value="' + CSS.escape(String(item.submitted_answer)) + '"]');
                selectedLi = selectedRadio && selectedRadio.closest('li');
            }
            return { target: mcDiv, optionTarget: selectedLi, container: mcDiv };
        }
        var field = document.querySelector('[name="' + CSS.escape(qid) + '"]') ||
            document.querySelector('[data-id="' + CSS.escape(qid) + '"]');
        if (!field) return null;
        var row = field.closest('tr');
        return {
            target: field,
            container: field.closest('li') || field.closest('[data-id]') || (row && row.querySelector('td:last-child')) || field.parentNode
        };

    function applyHistoryResultClass(el, isCorrect) {
        if (!el) return;
        el.classList.remove('correct', 'wrong', 'attempt-locked', 'mc-locked-reminder', 'mc-locked-answer');
        el.classList.add(isCorrect ? 'correct' : 'wrong');
        if (el.classList.contains('blank-input')) {
            el.removeAttribute('title');
        }
    }

    function markHistoryReview(review) {
        var answers = review && review.answers || [];
        var disputes = review && review.disputes || [];
        answers.forEach(function(item) {
            var qid = item.question_id;
            var dispute = disputeForQuestion(disputes, qid);
            var targetInfo = historyReviewTarget(item);
            if (!targetInfo) return;
            var target = targetInfo.target;
            var container = targetInfo.container;
            applyHistoryResultClass(target, item.correct);
            applyHistoryResultClass(targetInfo.optionTarget, item.correct);
            if (dispute) target.classList.add('history-disputed', 'history-dispute-' + (dispute.status || 'pending'));
            if (!container) return;
            if (historyReviewActionsAllowed(review, item)) {
                appendHistoryExplainButton(container, null, item);
            }
            if (!item.correct && historyReviewActionsAllowed(review, item)) {
                addQuestionArgueButton(qid, container, dispute && dispute.status !== 'pending'
                    ? 'Review teacher response'
                    : (dispute ? 'View sent Argue request' : 'Argue this answer'));
            }
        });
    }

    function showHistoryAnswers() {
        if (!historyAttemptId || !window.MrCatCloud) return Promise.resolve();
        var ready = answerRevealSavePromise || Promise.resolve();
        return ready.then(function() {
            var prefill = window.MrCatCloud.callFunction('getDashboard', {
                action: 'getAttemptForRetry',
                attempt_id: historyAttemptId
            });
            var review = window.MrCatCloud.callFunction('getDashboard', {
                action: 'getAttemptReview',
                attempt_id: historyAttemptId
            }).catch(function() { return null; });
            return Promise.all([prefill, review]);
        }).then(function(results) {
            var result = results[0];
            if (result && result.success && result.attempt && result.attempt.answers) {
                preserveViewport(function() {
                    clearAllAnswers();
                    applyAnswers(result.attempt.answers);
                    enableAnswerEditing();
                    rememberMcLocksFromAnswers(result.attempt.answers);
                    applyMcLocks();
                    saveDraftAnswers();
                    currentArgueAttemptId = historyAttemptId;
                    if (results[1] && results[1].review) markHistoryReview(results[1].review);
                });
            }
        }).catch(function() {});
    }

    function attemptFeedbackEligible(attempt) {
        return Boolean(attempt && (attempt.mastered === true || attempt.passed === true));
    }

    function renderEligibleHistoryReview() {
        if (!historyAttemptId || !historyFeedbackEligible || !window.MrCatCloud) return Promise.resolve(null);
        if (historyAutoReviewPromise) return historyAutoReviewPromise;
        historyAutoReviewPromise = showHistoryAnswers().then(function(result) {
            historyAutoReviewPromise = null;
            return result;
        });
        return historyAutoReviewPromise;
    }

    function setHistoryContextFromAttempt(attempt) {
        if (!attempt || !attempt.attempt_id) return false;
        if (!historyAttemptId) historyAttemptId = attempt.attempt_id;
        if (!assignmentId && attempt.assignment_id) assignmentId = attempt.assignment_id;
        historyFeedbackEligible = historyFeedbackEligible || attemptFeedbackEligible(attempt);
        if (attempt.mastered === true) assignmentStatus = 'mastered';
        else if (attempt.passed === true && assignmentStatus !== 'mastered') assignmentStatus = 'passed';
        if (attempt.percentage != null) {
            var percentage = Number(attempt.percentage);
            if (!isNaN(percentage)) historyBestPercentage = percentage;
        }
        return true;
    }

    function setHistoryContextFromDashboardItem(item) {
        if (!item) return false;
        var set = item.set || {};
        var itemSetId = item.set_id || set.set_id || set.id || '';
        if (String(itemSetId) !== String(setId)) return false;
        var attemptId = item.history_attempt_id || item.review_attempt_id || item.prefill_attempt_id || item.best_attempt_id || item.latest_attempt_id || '';
        if (!attemptId) return false;
        return setHistoryContextFromAttempt({
            attempt_id: attemptId,
            assignment_id: item.assignment_id || null,
            percentage: item.best_percentage == null ? item.latest_percentage : item.best_percentage
        });
    }

    function setHistoryContextFromDashboard(result) {
        if (!result || !result.success) return false;
        if (setHistoryContextFromAttempt(result.attempt)) return true;
        var matches = (result.assignments || []).filter(function(item) {
            var set = item && item.set || {};
            var itemSetId = item && (item.set_id || set.set_id || set.id) || '';
            return String(itemSetId) === String(setId);
        }).sort(function(left, right) {
            var leftAssigned = left.assignment_id ? 1 : 0;
            var rightAssigned = right.assignment_id ? 1 : 0;
            if (leftAssigned !== rightAssigned) return rightAssigned - leftAssigned;
            return Number(right.best_percentage || right.latest_percentage || 0) -
                Number(left.best_percentage || left.latest_percentage || 0);
        });
        return matches.some(setHistoryContextFromDashboardItem);
    }

    function loadHistoryContextFromDashboard() {
        if (historyAttemptId || teacherMode || studentId === 'VISITOR' || !setId || !window.MrCatCloud) {
            return Promise.resolve(null);
        }
        if (historyLookupPromise) return historyLookupPromise;
        historyLookupPending = true;
        updateHistoryToolbar();
        historyLookupPromise = window.MrCatCloud.callFunction('getDashboard', {
            action: 'getLatestAttemptForSet',
            set_id: setId
        }).then(function(result) {
            setHistoryContextFromDashboard(result);
            return result;
        }).catch(function() {
            return null;
        }).then(function(result) {
            historyLookupPending = false;
            updateHistoryToolbar();
            return result;
        });
        return historyLookupPromise;
    }

    function jumpToQuestion(questionId) {
        if (!questionId) return;
        var target = document.querySelector('[name="' + CSS.escape(questionId) + '"]') ||
            document.querySelector('[data-id="' + CSS.escape(questionId) + '"]');
        if (!target) return;
        var anchor = target.closest('li') || target.closest('[data-id]') || target.closest('tr') || target;
        anchor.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (target.focus) window.setTimeout(function() { target.focus(); }, 250);
    }

    function updateHistoryFromResponse(response) {
        if (!response || !response.attempt_id) return;
        var value = response.display_percentage == null ? response.percentage : response.display_percentage;
        var percentage = value == null ? null : Number(value);
        if (percentage != null && isNaN(percentage)) percentage = null;
        if (!historyAttemptId || historyBestPercentage == null || percentage == null || percentage >= historyBestPercentage) {
            historyAttemptId = response.attempt_id;
            if (percentage != null) historyBestPercentage = percentage;
        }
    }

    function teacherFriendlyError(error) {
        var message = error && (error.message || error.code || String(error)) || '';
        if (/t\.scope|null is not an object|AUTH_REQUIRED|TEACHER_REQUIRED|TEACHER_LOGIN_REQUIRED/i.test(message)) {
            return new Error('Teacher login is not active in this browser. Please open teacher.html, log in again, then open this practice from Library.');
        }
        return error instanceof Error ? error : new Error(message || 'Teacher action failed.');
    }

    function ensureTeacherSession() {
        if (!window.MrCatCloud || typeof window.MrCatCloud.getLoginState !== 'function') {
            return Promise.reject(new Error('TEACHER_LOGIN_REQUIRED'));
        }
        return window.MrCatCloud.getLoginState().then(function(state) {
            if (!state) throw new Error('TEACHER_LOGIN_REQUIRED');
            return true;
        }).catch(function(error) {
            throw teacherFriendlyError(error);
        });
    }

    function teacherCall(action, data) {
        return ensureTeacherSession().then(function() {
            return window.MrCatCloud.callFunction('teacherAdmin', Object.assign({ action: action }, data || {}));
        })
            .then(function(result) {
                if (!result || !result.success) throw new Error(result && result.message || 'Teacher action failed.');
                return result;
            }).catch(function(error) {
                throw teacherFriendlyError(error);
            });
    }

    function answerText(value) {
        return Array.isArray(value) ? value.join(' / ') : String(value == null ? '' : value);
    }

    function normalizeAnswer(value) {
        return String(value == null ? '' : value).trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function answerMatches(submitted, expected) {
        var accepted = Array.isArray(expected) ? expected : [expected];
        return accepted.some(function(answer) {
            return normalizeAnswer(answer) === normalizeAnswer(submitted);
        });
    }

    function questionTextForId(questionId) {
        var blank = (lessonData.blanks || []).find(function(item) { return item.id === questionId; });
        if (blank) return blank.prompt || blank.sentence || '';
        var mc = (lessonData.multipleChoice || []).find(function(item) { return item.id === questionId; });
        if (mc) return mc.question || '';
        return '';
    }

    function questionActionButtonHost(containerEl) {
        var lineEl = containerEl.classList && containerEl.classList.contains('mc-question')
            ? (containerEl.querySelector('.mc-title') || containerEl)
            : containerEl;
        lineEl.classList.add('question-action-host');
        var host = lineEl.querySelector(':scope > .question-action-buttons');
        if (host) return host;
        host = document.createElement('div');
        host.className = 'question-action-buttons';
        lineEl.appendChild(host);
        return host;
    }

    function addQuestionArgueButton(questionId, containerEl, label) {
        if (!questionId || !containerEl) return null;
        var existing = containerEl.querySelector('.argue-btn[data-argue-question="' + CSS.escape(String(questionId)) + '"]');
        if (existing) {
            containerEl.classList.add('question-action-host', 'has-argue-action');
            if (label) existing.setAttribute('aria-label', label);
            if (label) existing.title = label;
            return existing;
        }
        containerEl.classList.add('question-action-host', 'has-argue-action');
        var buttonHost = questionActionButtonHost(containerEl);
        var argueBtn = document.createElement('button');
        argueBtn.className = 'argue-btn';
        argueBtn.type = 'button';
        argueBtn.textContent = '!';
        argueBtn.title = label || 'Argue this answer';
        argueBtn.setAttribute('aria-label', label || 'Argue this answer');
        argueBtn.setAttribute('data-argue-question', questionId);
        argueBtn.addEventListener('click', function() {
            openArgueInline(questionId, containerEl);
        });
        buttonHost.appendChild(argueBtn);
        return argueBtn;
    }

    function addQuestionExplainButton(questionId, containerEl, detailEl, label, requireRevealConfirm) {
        if (!questionId || !containerEl || !detailEl) return null;
        if (requireRevealConfirm == null) requireRevealConfirm = true;
        var existing = containerEl.querySelector('.answer-toggle-btn[data-explain-question="' + CSS.escape(String(questionId)) + '"]');
        if (existing) return existing;
        containerEl.classList.add('question-action-host');
        var buttonHost = questionActionButtonHost(containerEl);
        var explainBtn = document.createElement('button');
        explainBtn.className = 'answer-toggle-btn';
        explainBtn.type = 'button';
        explainBtn.textContent = '?';
        explainBtn.title = label || 'Explain this answer';
        explainBtn.setAttribute('aria-label', label || 'Explain this answer');
        explainBtn.setAttribute('data-explain-question', questionId);
        explainBtn.addEventListener('click', function() {
            if (requireRevealConfirm && !detailEl.classList.contains('show') && !confirmAnswerReveal()) return;
            preserveViewport(function() {
                detailEl.classList.toggle('show');
                explainBtn.classList.toggle('active', detailEl.classList.contains('show'));
            });
