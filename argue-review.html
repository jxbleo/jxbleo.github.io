<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">

<body class="app-page teacher-page argue-review-page">
    <main class="argue-review-shell">
        <header class="argue-review-header">
            <a href="teacher.html" class="argue-back">← Teacher</a>
            <span id="argue-identity" class="muted"></span>
        </header>
        <p class="eyebrow accent">ARGUE</p>
        <h1 id="argue-title">Review request</h1>
        <p id="argue-student" class="muted"></p>
        <p id="argue-message" role="status" aria-live="polite">Loading…</p>
        <section id="argue-card" aria-label="Argue question"></section>
        <div id="argue-recovery" hidden>
            <button id="argue-retry" type="button" class="outline-button">Try again</button>
            <a id="argue-login" class="primary-button" hidden>Teacher sign-in</a>
            <button id="argue-switch" type="button" class="outline-button" hidden>Switch account</button>
        </div>
    </main>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
