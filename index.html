<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/mrcat-favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/mrcat-apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/touch-behavior.css?v=20260723-1">
    <meta name="color-scheme" content="light">
    <title>Mr. Cat Academy</title>
    <link rel="stylesheet" href="assets/css/app.css?v=20260820-1">
    <link rel="stylesheet" href="assets/css/liquid-glass-shell.css?v=20260713-1">
</head>
<body class="auth-page liquid-glass-shell liquid-glass-auth">
    <main class="auth-shell">
        <section class="brand-panel floating-paper-panel" aria-label="Welcome to Mr. Cat Academy">
            <div class="paper-scene" aria-hidden="true">
                <span class="paper-sheet one"></span>
                <span class="paper-sheet two"></span>
                <span class="paper-sheet three"></span>
                <span class="paper-pencil"></span>
                <span class="study-symbol headphones">
                    <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"></path><path d="M4 13v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2"></path><path d="M20 13v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2"></path></svg>
                </span>
                <span class="study-symbol words">
                    <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
                </span>
                <span class="study-symbol pen">
                    <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"></path><path d="M13 7l3 3"></path></svg>
                </span>
                <span class="study-symbol speak">
                    <svg viewBox="0 0 24 24"><path d="M5 12h3l4-4v8l-4-4H5z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
                </span>
            </div>
            <p class="paper-brand">Mr. Cat Academy</p>
            <div class="brand-quote">
                <p id="login-motivational-quote">Small steps every day create remarkable progress.</p>
            </div>
        </section>

        <section class="login-card" aria-labelledby="login-title">
            <h2 id="login-title" class="sr-only">Student sign in</h2>

            <form id="login-form" novalidate>
                <label for="student-id">Student ID</label>
                <input id="student-id" name="student-id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <p class="form-message" id="login-message" role="alert"></p>
                <button class="primary-button" id="login-button" type="submit">Sign in</button>
            </form>

            <div class="divider"><span>or</span></div>
            <button class="secondary-button" id="parent-mode-button" type="button">Continue as parent</button>
            <button class="secondary-button" id="visitor-button" type="button">Continue as visitor</button>
        </section>
    </main>

    <footer class="site-filing-footer" aria-label="Brand, contact, and website registration information">
        <div class="site-filing-bar">
            <div class="site-contact-links">
                <span class="site-brand-handle">@猫先生英语</span>
                <span class="site-contact-separator" aria-hidden="true">·</span>
                <a class="site-contact-email" href="mailto:jxbleo@foxmail.com">jxbleo@foxmail.com</a>
            </div>
            <span class="site-filing-separator" aria-hidden="true"></span>
            <nav class="site-filing-links" aria-label="Website registration information">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026107102号-1</a>
                <a class="public-security-filing" href="https://beian.mps.gov.cn/#/query/webSearch?code=44030002015814" target="_blank" rel="noopener noreferrer">
                    <img src="assets/icons/public-security-filing.png" alt="" aria-hidden="true">
                    <span>粤公网安备44030002015814号</span>
                </a>
            </nav>
        </div>
    </footer>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
    <script src="assets/js/config.public.js?v=20260815-1"></script>
    <script src="assets/js/cloudbase-client.js?v=20260815-2"></script>
    <script src="assets/js/auth.js?v=20260810-1"></script>
    <script src="assets/js/login-navigation.js?v=20260819-1"></script>
    <script src="assets/js/login.js?v=20260819-1"></script>
    <script src="assets/js/liquid-glass-shell.js?v=20260830-3"></script>
</body>
</html>
