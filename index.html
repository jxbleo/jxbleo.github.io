<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Mr. Cat Academy</title>
    <link rel="stylesheet" href="assets/css/app.css?v=20260620-4">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="brand-panel floating-paper-panel" aria-label="Welcome to Mr. Cat Academy">
            <div class="paper-scene" aria-hidden="true">
                <span class="paper-sheet one"></span>
                <span class="paper-sheet two"></span>
                <span class="paper-sheet three"></span>
                <span class="paper-pencil"></span>
                <span class="study-symbol headphones">
                    <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"></path><path d="M4 13v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2"></path><path d="M20 13v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2"></path></svg>
                </span>
                <span class="study-symbol words">
                    <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
                </span>
                <span class="study-symbol pen">
                    <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"></path><path d="M13 7l3 3"></path></svg>
                </span>
                <span class="study-symbol speak">
                    <svg viewBox="0 0 24 24"><path d="M5 12h3l4-4v8l-4-4H5z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
                </span>
            </div>
            <p class="paper-brand">Mr. Cat Academy</p>
            <div class="brand-quote">
                <p>A fresh page is waiting for today's work.</p>
            </div>
        </section>

        <section class="login-card" aria-labelledby="login-title">
            <div>
                <p class="eyebrow accent">STUDENT ENTRY</p>
                <h2 id="login-title" class="sr-only">Student sign in</h2>
            </div>

            <form id="login-form" novalidate>
                <label for="student-id">Student ID</label>
                <input id="student-id" name="student-id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <p class="form-message" id="login-message" role="alert"></p>
                <button class="primary-button" id="login-button" type="submit">Sign in</button>
            </form>

            <div class="divider"><span>or</span></div>
            <button class="secondary-button" id="visitor-button" type="button">Continue as Visitor</button>
            <p class="fine-print">Visitor mode is view-only.</p>
        </section>
    </main>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
    <script src="assets/js/config.public.js?v=20260707-4"></script>
    <script src="assets/js/cloudbase-client.js?v=20260707-4"></script>
    <script src="assets/js/auth.js?v=20260707-4"></script>
    <script src="assets/js/login.js?v=20260619-1"></script>
</body>
</html>
